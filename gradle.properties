# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx1024m -XX:+UseG1GC -Dfile.encoding=UTF-8
# The Kotlin daemon inherits a small default heap here and OOMs on this module;
# give it its own budget instead.
kotlin.daemon.jvmargs=-Xmx3584m -XX:+UseG1GC
org.gradle.java.home=C:\\Users\\rosha\\AppData\\Local\\Programs\\jdk-17\\jdk-17.0.20.1+1
android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=36

# Performance optimizations
org.gradle.parallel=false
org.gradle.caching=false
kotlin.incremental=false
kapt.incremental.apt=false

# Use native Termux ARM64 aapt2 (Uncomment when building inside Termux on Android)
# android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
