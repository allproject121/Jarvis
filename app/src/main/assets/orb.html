<script>
(function(){

const FOV=45, VIS=3.6, ORBIT=36, COUNT=6000;
const STATES={
  idle:     {scale:1.00,speed:.40,cyan:.45,purple:.55,bright:1.05,glow:.60,ring:.25,wob:0},
  listening:{scale:1.06,speed:.90,cyan:1.00,purple:.30,bright:1.20,glow:.95,ring:.45,wob:0},

const scene=new THREE.Scene();

/* Ambient & directional lights for 3D meshes (AI Girl, Custom 3D & Arc Reactor) */
const ambLight = new THREE.AmbientLight(0xffffff, 0.85);
scene.add(ambLight);

rimLight.position.set(-3, 2, -2);

/* Shared uniforms */
const U={uTime:{value:0},uAmp:{value:0},uBass:{value:0},uHigh:{value:0},uCyan:{value:.35},uPurple:{value:.45},uBright:{value:1},uPx:{value:300},uCamZ:{value:6},DEEP:{value:new THREE.Color()},BLUE:{value:new THREE.Color()},CYAN:{value:new THREE.Color()},PURP:{value:new THREE.Color()}};
const UNI="uniform float uTime,uAmp,uBass,uHigh,uCyan,uPurple,uBright,uPx,uCamZ;uniform vec3 DEEP,BLUE,CYAN,PURP;";
const PAL="";

/* ---------- 3D particle volume ---------- */
const partV=UNI+PAL+`attribute float aRnd;varying vec3 vC;varying float vA;
void main(){
 float base=length(position);vec3 d=position/base;float t=uTime;
 float n=sin(d.x*3.+t*.8+aRnd*6.)*sin(d.y*3.-t*.6)*sin(d.z*3.+t*.5);
 float r=base*(1.+n*.05+uAmp*.1*aRnd+.015*sin(t*2.+aRnd*20.));
 vec4 mv=modelViewMatrix*vec4(d*r,1.);
 float depth=smoothstep(-1.,1.,mv.z+uCamZ);          /* 0 = back, 1 = front */
 vA=mix(.22,1.,depth);
 vec3 c=mix(BLUE,CYAN,smoothstep(-.5,.9,d.y+n)*uCyan);
 c=mix(c,PURP,smoothstep(.1,.9,d.x*.6-d.y*.3+aRnd*.4)*uPurple);
 c=mix(DEEP,c,.5+.5*aRnd);
 vC=c*uBright*mix(.6,1.,depth);
 gl_PointSize=max((.009+aRnd*.017)*(1.+uAmp*.5)*uPx/(-mv.z)*mix(.85,1.2,depth),1.7);
 gl_Position=projectionMatrix*mv;}`;
const dotF="precision highp float;varying vec3 vC;varying float vA;void main(){float d=length(gl_PointCoord-.5);gl_FragColor=vec4(vC,smoothstep(.5,.05,d)*vA);}";
function buildParticles(){
  const pos=new Float32Array(COUNT*3),rnd=new Float32Array(COUNT);
  for(let i=0;i<COUNT;i++){
    const y=1-2*(i+.5)/COUNT,r=Math.sqrt(1-y*y),th=i*2.39996;
    const shell=.93+.07*Math.random();
    pos.set([Math.cos(th)*r*shell,y*shell,Math.sin(th)*r*shell],i*3);rnd[i]=Math.random();
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("aRnd",new THREE.BufferAttribute(rnd,1));
  const p=new THREE.Points(g,new THREE.ShaderMaterial({vertexShader:partV,fragmentShader:dotF,uniforms:U,transparent:true,depthWrite:false}));
  p.frustumCulled=false;p.renderOrder=1;return p;
}

const orb=new THREE.Group();
const pointsMesh=buildParticles();
orb.add(pointsMesh);scene.add(orb);

/* ---------- Glow (outer halo only) ---------- */
let glowMat,glow,ring1,ring2,ring3,orbitPts,ptData=[];
function createGlow(){
  glowMat=new THREE.ShaderMaterial({
    vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
    fragmentShader:`varying vec2 vUv;uniform float uTime,uStrength,uMix;uniform vec3 uA,uB,uC;
void main(){vec2 c=vUv-.5;float d=length(c)*2.,a=atan(c.y,c.x);
 float g=(d>.68?exp(-(d-.68)*6.5)*.75:0.)*smoothstep(1.,.78,d);
 vec3 col=mix(mix(uA,uB,.5+.5*sin(a+uTime*.4)),uC,uMix*(.5+.5*sin(a*2.-uTime*.6)));
 gl_FragColor=vec4(col,clamp(g*uStrength*.5,0.,.55));}`,
    transparent:true,depthWrite:false,depthTest:false,uniforms:{uTime:{value:0},uStrength:{value:.5},uMix:{value:.3},uA:U.BLUE,uB:U.PURP,uC:U.CYAN}});
  glow=new THREE.Mesh(new THREE.PlaneGeometry(VIS,VIS),glowMat);glow.position.z=-.05;glow.renderOrder=-2;scene.add(glow);
}
function createRing(r0,r1,segs,seed,alpha){
  const m=new THREE.Mesh(new THREE.RingGeometry(r0,r1,128,1),new THREE.ShaderMaterial({
    vertexShader:"varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}",
    fragmentShader:`varying vec2 vP;uniform float uAlpha,uSeed,uSegs;uniform vec3 uA,uB,uC;
void main(){float a=atan(vP.y,vP.x);
 float m=smoothstep(-.25,.35,sin(a*uSegs+uSeed))*smoothstep(-.9,-.2,sin(a+uSeed*.7));
 vec3 col=mix(mix(uC,uA,.5+.5*sin(a+uSeed)),uB,.5+.5*sin(a*2.-uSeed));
 gl_FragColor=vec4(col,m*uAlpha);}`,
    transparent:true,depthWrite:false,side:THREE.DoubleSide,uniforms:{uAlpha:{value:alpha},uSeed:{value:seed},uSegs:{value:segs},uA:U.BLUE,uB:U.PURP,uC:U.CYAN}}));
  m.renderOrder=0;scene.add(m);return m;
}
function createParticles(){
  const pos=new Float32Array(ORBIT*3),size=new Float32Array(ORBIT),alpha=new Float32Array(ORBIT),color=new Float32Array(ORBIT*3);

  for(let i=0;i<ORBIT;i++){color.set(pal[i%3],i*3);size[i]=.02+Math.random()*.045;
    ptData.push({a:Math.random()*6.283,r:1.5+Math.random()*.55,sp:(.08+Math.random()*.18)*(Math.random()<.5?-1:1),ph:Math.random()*6.283,tilt:(Math.random()-.5)*1.2,y:(Math.random()-.5)*1.1,fs:.2+Math.random()*.4});}
  const g=new THREE.BufferGeometry();
  g.setAttribute("position",new THREE.BufferAttribute(pos,3));g.setAttribute("aSize",new THREE.BufferAttribute(size,1));
  g.setAttribute("aAlpha",new THREE.BufferAttribute(alpha,1));g.setAttribute("aColor",new THREE.BufferAttribute(color,3));
  orbitPts=new THREE.Points(g,new THREE.ShaderMaterial({
    vertexShader:"attribute float aSize,aAlpha;attribute vec3 aColor;uniform float uPx;varying float vA;varying vec3 vC;void main(){vA=aAlpha;vC=aColor;vec4 mv=modelViewMatrix*vec4(position,1.);gl_PointSize=max(aSize*uPx/(-mv.z),1.);gl_Position=projectionMatrix*mv;}",
    fragmentShader:dotF,transparent:true,depthWrite:false,uniforms:{uPx:U.uPx}}));
  orbitPts.frustumCulled=false;orbitPts.renderOrder=3;scene.add(orbitPts);
}
createGlow();ring1=createRing(1.255,1.272,2,0,.5);ring2=createRing(1.38,1.388,3,2.1,.3);ring3=createRing(1.49,1.502,4,4.2,.4);ring3.rotation.x=1.05;createParticles();

  if (!aiGirlGroup || !aiGirlGroup.visible) return;

  // 1. Natural Anime Breathing Motion & Ahoge Dynamic Spring
  const breath = Math.sin(t * 2.2);
  girlTorso.position.y = breath * 0.020;
  girlTorso.scale.y = 1.0 + breath * 0.012;
  girlChestCore.scale.setScalar(1.0 + breath * 0.15 + audio.level * 0.35);
  girlHaloWing.rotation.z += dt * 0.35;
  if (girlHaloInner) girlHaloInner.rotation.z -= dt * 0.45;

  // Jett's Radiant Blade Storm Dynamic Kunai Orbit
  if (jettKunaiStorm) {
    const isTalking = state === "speaking" || audio.level > 0.05;
    const isEmoting = (emoteTimer > 0) || (waveAnimationTimer > 0);
    const stormSpeed = isTalking ? 2.2 : (isEmoting ? 2.8 : 0.85);
    jettKunaiStorm.rotation.y += dt * stormSpeed;
    jettKunaiStorm.position.y = 0.15 + Math.sin(t * 2.4) * 0.025;
  }

  // Ahoge Bouncy Hair Strand Dynamics (Signature anime bounce)
  if (girlAhoge) {
    girlAhoge.rotation.z = Math.sin(t * 3.6) * 0.12;
    girlAhoge.rotation.x = Math.cos(t * 2.8) * 0.08;
  }

  // 2. Eye Blinking (Natural anime blink every ~3.6 seconds)
  const blinkCycle = t % 3.6;
  const isBlinking = blinkCycle < 0.11;
  const eyeScaleY = isBlinking ? 0.08 : 1.0;

  // 3. Audio Lip-Sync (Dynamic anime mouth opening with voice amplitude)
  const isTalking = state === "speaking" || audio.level > 0.05;
  const mouthOpen = 0.22 + (audio.level * 2.8) + (isTalking ? Math.abs(Math.sin(t * 11)) * 0.45 : 0);
  girlMouth.scale.y = THREE.MathUtils.lerp(girlMouth.scale.y, mouthOpen, dt * 18);
  girlMouth.scale.x = THREE.MathUtils.lerp(girlMouth.scale.x, isTalking ? 1.15 : 1.0, dt * 8);

  // 4. Interactive Emotes (Triggered on touch / poke or triggerTouchReaction)
  const isEmoting = (emoteTimer > 0) || (waveAnimationTimer > 0);
  if (isEmoting) {
    if (waveAnimationTimer > 0) {
      waveAnimationTimer -= dt;
      activeEmote = "wave";
    } else {
      emoteTimer -= dt;
    }

    if (activeEmote === "wave") {
      // 1. WAVE / GREETING EMOTE
      girlEyeLGroup.scale.set(1.0, 0.35, 1.0);
      girlEyeRGroup.scale.set(1.0, 0.35, 1.0);
      girlBlushMat.opacity = THREE.MathUtils.lerp(girlBlushMat.opacity, 0.95, dt * 10);
      girlMouth.scale.set(1.4, 2.0, 1.0);
      if (girlAhoge) girlAhoge.rotation.z = Math.sin(t * 14.0) * 0.25;

      girlRightArm.rotation.x = THREE.MathUtils.lerp(girlRightArm.rotation.x, -1.95, dt * 10);
      girlRightArm.rotation.z = THREE.MathUtils.lerp(girlRightArm.rotation.z, 0.45, dt * 10);
      girlRightElbow.rotation.z = Math.sin(t * 15) * 0.45;
      girlRightElbow.rotation.x = -0.3;

      girlLeftArm.rotation.x = THREE.MathUtils.lerp(girlLeftArm.rotation.x, -0.4, dt * 6);
      girlLeftArm.rotation.z = THREE.MathUtils.lerp(girlLeftArm.rotation.z, 0.2, dt * 6);
      girlLeftElbow.rotation.x = THREE.MathUtils.lerp(girlLeftElbow.rotation.x, -0.6, dt * 6);

      girlHead.rotation.z = THREE.MathUtils.lerp(girlHead.rotation.z, 0.12, dt * 8);
      girlHead.rotation.y = THREE.MathUtils.lerp(girlHead.rotation.y, 0.05, dt * 8);
      return;
    } else if (activeEmote === "nod") {
      // 2. HAPPY BOUNCY NOD / AFFIRMATION
      const nodWave = Math.sin((1.8 - emoteTimer) * Math.PI * 4);
      girlHead.rotation.x = nodWave * 0.18;
      girlTorso.position.y = breath * 0.02 + nodWave * 0.035;
      girlEyeLGroup.scale.set(1.0, 0.75, 1.0);
      girlEyeRGroup.scale.set(1.0, 0.75, 1.0);
      girlBlushMat.opacity = THREE.MathUtils.lerp(girlBlushMat.opacity, 0.85, dt * 8);
      girlMouth.scale.set(1.2, 1.4, 1.0);
      if (girlAhoge) girlAhoge.rotation.z = Math.sin(t * 16.0) * 0.28;

      girlRightArm.rotation.x = THREE.MathUtils.lerp(girlRightArm.rotation.x, -0.45, dt * 8);
      girlRightArm.rotation.z = THREE.MathUtils.lerp(girlRightArm.rotation.z, -0.15, dt * 8);
      girlRightElbow.rotation.x = THREE.MathUtils.lerp(girlRightElbow.rotation.x, -0.75, dt * 8);
      girlLeftArm.rotation.x = THREE.MathUtils.lerp(girlLeftArm.rotation.x, -0.45, dt * 8);
      girlLeftArm.rotation.z = THREE.MathUtils.lerp(girlLeftArm.rotation.z, 0.15, dt * 8);
      girlLeftElbow.rotation.x = THREE.MathUtils.lerp(girlLeftElbow.rotation.x, -0.75, dt * 8);
      return;
    } else if (activeEmote === "curious") {
      // 3. CURIOUS HEAD TILT ("EH? / NANI?")
      girlHead.rotation.z = THREE.MathUtils.lerp(girlHead.rotation.z, 0.26, dt * 8);
      girlHead.rotation.y = THREE.MathUtils.lerp(girlHead.rotation.y, 0.14, dt * 8);
      girlHead.rotation.x = THREE.MathUtils.lerp(girlHead.rotation.x, -0.10, dt * 8);

      girlEyeLGroup.scale.set(1.15, 1.15, 1.0);
      girlEyeRGroup.scale.set(1.15, 1.15, 1.0);
      girlEyebrowL.position.y = THREE.MathUtils.lerp(girlEyebrowL.position.y, 0.145, dt * 8);
      girlEyebrowR.position.y = THREE.MathUtils.lerp(girlEyebrowR.position.y, 0.145, dt * 8);
      girlMouth.scale.set(0.70, 1.6, 1.0);
      girlBlushMat.opacity = THREE.MathUtils.lerp(girlBlushMat.opacity, 0.65, dt * 6);
      if (girlAhoge) girlAhoge.rotation.z = Math.sin(t * 10.0) * 0.20;

      girlRightArm.rotation.x = THREE.MathUtils.lerp(girlRightArm.rotation.x, -1.05, dt * 8);
      girlRightArm.rotation.z = THREE.MathUtils.lerp(girlRightArm.rotation.z, -0.25, dt * 8);
      girlRightElbow.rotation.x = THREE.MathUtils.lerp(girlRightElbow.rotation.x, -1.35, dt * 8);
      return;
    } else if (activeEmote === "blush") {
      // 4. SHY BLUSHING & GIGGLE
      girlHead.rotation.z = THREE.MathUtils.lerp(girlHead.rotation.z, -0.12, dt * 8);
      girlHead.rotation.x = THREE.MathUtils.lerp(girlHead.rotation.x, 0.10, dt * 8);
      girlBlushMat.opacity = THREE.MathUtils.lerp(girlBlushMat.opacity, 1.0, dt * 10);
      girlEyeLGroup.scale.set(1.0, 0.45, 1.0);
      girlEyeRGroup.scale.set(1.0, 0.45, 1.0);
      girlMouth.scale.set(1.1, 1.3, 1.0);
      girlTorso.position.y = breath * 0.02 + Math.sin(t * 12.0) * 0.015;

      girlRightArm.rotation.x = THREE.MathUtils.lerp(girlRightArm.rotation.x, -0.85, dt * 8);
      girlRightArm.rotation.z = THREE.MathUtils.lerp(girlRightArm.rotation.z, -0.32, dt * 8);
      girlRightElbow.rotation.x = THREE.MathUtils.lerp(girlRightElbow.rotation.x, -1.15, dt * 8);
      girlLeftArm.rotation.x = THREE.MathUtils.lerp(girlLeftArm.rotation.x, -0.85, dt * 8);
      girlLeftArm.rotation.z = THREE.MathUtils.lerp(girlLeftArm.rotation.z, 0.32, dt * 8);
      girlLeftElbow.rotation.x = THREE.MathUtils.lerp(girlLeftElbow.rotation.x, -1.15, dt * 8);
      return;
    } else if (activeEmote === "success") {
      // 5. VICTORY CHEER & TASK SUCCESS EMOTE
      girlEyeLGroup.scale.set(1.0, 0.40, 1.0);
      girlEyeRGroup.scale.set(1.0, 0.40, 1.0);
      girlBlushMat.opacity = THREE.MathUtils.lerp(girlBlushMat.opacity, 1.0, dt * 10);
      girlMouth.scale.set(1.4, 2.0, 1.0);
      const hop = Math.sin((2.2 - emoteTimer) * Math.PI * 3) * 0.04;
      girlTorso.position.y = breath * 0.02 + hop;
      girlHead.rotation.x = Math.sin(t * 12) * 0.10;

      // Both arms raised in triumph
      girlRightArm.rotation.x = THREE.MathUtils.lerp(girlRightArm.rotation.x, -2.1, dt * 10);
      girlRightArm.rotation.z = THREE.MathUtils.lerp(girlRightArm.rotation.z, 0.55, dt * 10);
      girlRightElbow.rotation.x = THREE.MathUtils.lerp(girlRightElbow.rotation.x, -0.4, dt * 10);

      girlLeftArm.rotation.x = THREE.MathUtils.lerp(girlLeftArm.rotation.x, -2.1, dt * 10);
      girlLeftArm.rotation.z = THREE.MathUtils.lerp(girlLeftArm.rotation.z, -0.55, dt * 10);
      girlLeftElbow.rotation.x = THREE.MathUtils.lerp(girlLeftElbow.rotation.x, -0.4, dt * 10);
      return;
    } else if (activeEmote === "failed") {
      // 6. CONFUSED SHRUG & TASK FAILURE EMOTE
      girlEyeLGroup.scale.set(1.1, 1.1, 1.0);
      girlEyeRGroup.scale.set(1.1, 1.1, 1.0);
      girlEyebrowL.rotation.z = THREE.MathUtils.lerp(girlEyebrowL.rotation.z, 0.12, dt * 8);
      girlEyebrowR.rotation.z = THREE.MathUtils.lerp(girlEyebrowR.rotation.z, -0.12, dt * 8);
      girlHead.rotation.z = THREE.MathUtils.lerp(girlHead.rotation.z, 0.22, dt * 8);
      girlHead.rotation.x = THREE.MathUtils.lerp(girlHead.rotation.x, -0.08, dt * 8);
      girlMouth.scale.set(0.9, 0.8, 1.0);

      girlRightArm.rotation.x = THREE.MathUtils.lerp(girlRightArm.rotation.x, -0.30, dt * 8);
      girlRightArm.rotation.z = THREE.MathUtils.lerp(girlRightArm.rotation.z, 0.55, dt * 8);
      girlRightElbow.rotation.x = THREE.MathUtils.lerp(girlRightElbow.rotation.x, -1.0, dt * 8);

      girlLeftArm.rotation.x = THREE.MathUtils.lerp(girlLeftArm.rotation.x, -0.30, dt * 8);
      girlLeftArm.rotation.z = THREE.MathUtils.lerp(girlLeftArm.rotation.z, -0.55, dt * 8);
      girlLeftElbow.rotation.x = THREE.MathUtils.lerp(girlLeftElbow.rotation.x, -1.0, dt * 8);
      return;
    }
  }

  // Restore Eye Blink Scale when not emoting
  girlEyeLGroup.scale.set(1.0, eyeScaleY, 1.0);
  girlEyeRGroup.scale.set(1.0, eyeScaleY, 1.0);

  // Smooth Gaze Tracking towards touch pointer
  gazeX = THREE.MathUtils.lerp(gazeX, targetGazeX, dt * 7);
  gazeY = THREE.MathUtils.lerp(gazeY, targetGazeY, dt * 7);
  girlHead.rotation.y += gazeX * 0.35;
  girlHead.rotation.x += -gazeY * 0.25;
  if (girlEyeLGroup && girlEyeRGroup) {
    girlEyeLGroup.position.x = -0.105 + gazeX * 0.014;
    girlEyeLGroup.position.y = 0.01 - gazeY * 0.010;
    girlEyeRGroup.position.x = 0.105 + gazeX * 0.014;
    girlEyeRGroup.position.y = 0.01 - gazeY * 0.010;
  }

  // Standing Weight-Shift Dynamics on Pelvis, Hips, Knees & Feet
  const weightCycle = Math.sin(t * 0.65);
  if (girlPelvis && girlLeftLeg && girlRightLeg && girlLeftKnee && girlRightKnee) {
    const rollZ = weightCycle * 0.035;
    girlPelvis.rotation.z = THREE.MathUtils.lerp(girlPelvis.rotation.z, rollZ, dt * 4);

    const leftKneeBend = weightCycle > 0 ? (weightCycle * 0.14) : 0.02;
    const rightKneeBend = weightCycle < 0 ? (-weightCycle * 0.14) : 0.02;

    girlLeftLeg.rotation.z = THREE.MathUtils.lerp(girlLeftLeg.rotation.z, -rollZ * 0.6, dt * 4);
    girlRightLeg.rotation.z = THREE.MathUtils.lerp(girlRightLeg.rotation.z, -rollZ * 0.6, dt * 4);

    girlLeftKnee.rotation.x = THREE.MathUtils.lerp(girlLeftKnee.rotation.x, leftKneeBend, dt * 4);
    girlRightKnee.rotation.x = THREE.MathUtils.lerp(girlRightKnee.rotation.x, rightKneeBend, dt * 4);

    if (girlLeftFoot && girlRightFoot) {
      girlLeftFoot.rotation.x = THREE.MathUtils.lerp(girlLeftFoot.rotation.x, -leftKneeBend * 0.5, dt * 4);
      girlRightFoot.rotation.x = THREE.MathUtils.lerp(girlRightFoot.rotation.x, -rightKneeBend * 0.5, dt * 4);
    }
  }

  // 5. State-based Conversational Anime Gestures & Emotes
  if (state === "idle") {
    // Soft subtle blush
    girlBlushMat.opacity = THREE.MathUtils.lerp(girlBlushMat.opacity, 0.45, dt * 4);

    const armSway = Math.sin(t * 1.5) * 0.04;
    girlRightArm.rotation.x = THREE.MathUtils.lerp(girlRightArm.rotation.x, 0.14 + armSway, dt * 4);
    girlRightArm.rotation.z = THREE.MathUtils.lerp(girlRightArm.rotation.z, -0.14, dt * 4);
    girlRightElbow.rotation.x = THREE.MathUtils.lerp(girlRightElbow.rotation.x, -0.28, dt * 4);
    girlRightElbow.rotation.z = 0;

    girlLeftArm.rotation.x = THREE.MathUtils.lerp(girlLeftArm.rotation.x, 0.14 - armSway, dt * 4);
    girlLeftArm.rotation.z = THREE.MathUtils.lerp(girlLeftArm.rotation.z, 0.14, dt * 4);
    girlLeftElbow.rotation.x = THREE.MathUtils.lerp(girlLeftElbow.rotation.x, -0.28, dt * 4);

    girlHead.rotation.y = Math.sin(t * 0.7) * 0.05;
    girlHead.rotation.x = Math.sin(t * 1.1) * 0.03;
    girlHead.rotation.z = 0;
    girlTorso.rotation.x = THREE.MathUtils.lerp(girlTorso.rotation.x, 0, dt * 4);

    girlEyebrowL.rotation.z = -0.08;
    girlEyebrowR.rotation.z = 0.08;
  }
  else if (state === "listening") {
    // Curious Anime Head Tilt & Attentive Eyes
    girlBlushMat.opacity = THREE.MathUtils.lerp(girlBlushMat.opacity, 0.70, dt * 5);

    girlTorso.rotation.x = THREE.MathUtils.lerp(girlTorso.rotation.x, 0.10, dt * 5);
    girlHead.rotation.x = THREE.MathUtils.lerp(girlHead.rotation.x, -0.05 + Math.sin(t * 2.8) * 0.03, dt * 6);
    girlHead.rotation.z = THREE.MathUtils.lerp(girlHead.rotation.z, 0.14, dt * 5); // Cute sideways head tilt
    girlHead.rotation.y = THREE.MathUtils.lerp(girlHead.rotation.y, 0.03, dt * 5);

    // Eyebrows raised slightly with curiosity
    girlEyebrowL.position.y = THREE.MathUtils.lerp(girlEyebrowL.position.y, 0.135, dt * 5);
    girlEyebrowR.position.y = THREE.MathUtils.lerp(girlEyebrowR.position.y, 0.135, dt * 5);

    // Left hand near chest, attentive pose
    girlRightArm.rotation.x = THREE.MathUtils.lerp(girlRightArm.rotation.x, -0.30, dt * 4);
    girlRightArm.rotation.z = THREE.MathUtils.lerp(girlRightArm.rotation.z, -0.20, dt * 4);
    girlRightElbow.rotation.x = THREE.MathUtils.lerp(girlRightElbow.rotation.x, -0.65, dt * 4);

    girlLeftArm.rotation.x = THREE.MathUtils.lerp(girlLeftArm.rotation.x, -0.45, dt * 4);
    girlLeftArm.rotation.z = THREE.MathUtils.lerp(girlLeftArm.rotation.z, 0.25, dt * 4);
    girlLeftElbow.rotation.x = THREE.MathUtils.lerp(girlLeftElbow.rotation.x, -0.80, dt * 4);
  }
  else if (state === "thinking") {
    // Thoughtful Anime Pose: Hand to chin, head tilted up-right
    girlBlushMat.opacity = THREE.MathUtils.lerp(girlBlushMat.opacity, 0.40, dt * 4);

    girlTorso.rotation.x = THREE.MathUtils.lerp(girlTorso.rotation.x, 0.0, dt * 4);
    girlHead.rotation.x = THREE.MathUtils.lerp(girlHead.rotation.x, -0.15, dt * 5);
    girlHead.rotation.y = THREE.MathUtils.lerp(girlHead.rotation.y, 0.18, dt * 5);
    girlHead.rotation.z = THREE.MathUtils.lerp(girlHead.rotation.z, -0.06, dt * 5);

    // Eyebrows tilted thoughtfully
    girlEyebrowL.rotation.z = THREE.MathUtils.lerp(girlEyebrowL.rotation.z, -0.16, dt * 6);
    girlEyebrowR.rotation.z = THREE.MathUtils.lerp(girlEyebrowR.rotation.z, 0.16, dt * 6);

    // Right arm lifts hand to chin
    girlRightArm.rotation.x = THREE.MathUtils.lerp(girlRightArm.rotation.x, -1.15, dt * 6);
    girlRightArm.rotation.z = THREE.MathUtils.lerp(girlRightArm.rotation.z, -0.38, dt * 6);
    girlRightElbow.rotation.x = THREE.MathUtils.lerp(girlRightElbow.rotation.x, -1.45, dt * 6);
    girlRightElbow.rotation.y = THREE.MathUtils.lerp(girlRightElbow.rotation.y, 0.38, dt * 6);

    // Left arm folds across waist supporting right arm
    girlLeftArm.rotation.x = THREE.MathUtils.lerp(girlLeftArm.rotation.x, -0.80, dt * 5);
    girlLeftArm.rotation.z = THREE.MathUtils.lerp(girlLeftArm.rotation.z, 0.48, dt * 5);
    girlLeftElbow.rotation.x = THREE.MathUtils.lerp(girlLeftElbow.rotation.x, -1.05, dt * 5);

    // Ahoge twitches thoughtfully
    if (girlAhoge) girlAhoge.rotation.z = Math.sin(t * 8.0) * 0.16;
  }
  else if (state === "speaking") {
    // Dynamic Conversational Gestures & Anime Head Nods
    girlBlushMat.opacity = THREE.MathUtils.lerp(girlBlushMat.opacity, 0.65, dt * 4);

    girlTorso.rotation.x = THREE.MathUtils.lerp(girlTorso.rotation.x, 0.03, dt * 4);
    girlHead.rotation.x = Math.sin(t * 4.2) * 0.05;
    girlHead.rotation.y = Math.sin(t * 1.8) * 0.08;
    girlHead.rotation.z = Math.sin(t * 2.2) * 0.03;

    // Expressive alternating hand gestures
    const gR = Math.sin(t * 3.4) * 0.22;
    const gL = Math.cos(t * 3.0) * 0.20;
    girlRightArm.rotation.x = THREE.MathUtils.lerp(girlRightArm.rotation.x, -0.65 + gR, dt * 6);
    girlRightArm.rotation.z = THREE.MathUtils.lerp(girlRightArm.rotation.z, -0.30 + gR * 0.4, dt * 6);
    girlRightElbow.rotation.x = THREE.MathUtils.lerp(girlRightElbow.rotation.x, -0.90 + gR * 0.5, dt * 6);

    girlLeftArm.rotation.x = THREE.MathUtils.lerp(girlLeftArm.rotation.x, -0.60 + gL, dt * 6);
    girlLeftArm.rotation.z = THREE.MathUtils.lerp(girlLeftArm.rotation.z, 0.30 - gL * 0.4, dt * 6);
    girlLeftElbow.rotation.x = THREE.MathUtils.lerp(girlLeftElbow.rotation.x, -0.85 + gL * 0.5, dt * 6);
  }
}

/* ---------- Stark Arc Reactor Mechanical Core Group ---------- */
let arcReactorGroup = null;
let arcCoils = [], arcInnerLens, arcCoreLight, arcCopperMat, arcGlowMatRing;

function buildArcReactor() {
  arcReactorGroup = new THREE.Group();
  arcReactorGroup.visible = false;

  const metalMat = new THREE.MeshStandardMaterial({
    color: 0x0f172a,
    metalness: 0.95,
    roughness: 0.2
  });

  arcGlowMatRing = new THREE.MeshBasicMaterial({
    color: 0x22d3ee,
    transparent: true,
    opacity: 0.95
  });

  arcCopperMat = new THREE.MeshStandardMaterial({
    color: 0xd97706,
    metalness: 0.85,
    roughness: 0.3
  });

  const outerRing = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.08, 16, 64), metalMat);
  arcReactorGroup.add(outerRing);

  const coilGeom = new THREE.BoxGeometry(0.12, 0.22, 0.14);
  for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2;
    const coil = new THREE.Mesh(coilGeom, arcCopperMat);
    coil.position.set(Math.cos(angle) * 1.2, Math.sin(angle) * 1.2, 0);
    coil.rotation.z = angle;
    arcReactorGroup.add(coil);
    arcCoils.push(coil);
  }

  arcInnerLens = new THREE.Mesh(new THREE.RingGeometry(0.55, 0.85, 32), arcGlowMatRing);
  arcReactorGroup.add(arcInnerLens);

  const coreMesh = new THREE.Mesh(new THREE.CircleGeometry(0.42, 3), arcGlowMatRing);
  arcReactorGroup.add(coreMesh);
  arcCoreLight = coreMesh;

  scene.add(arcReactorGroup);
}

function updateArcReactor(t, dt) {
  if (!arcReactorGroup || !arcReactorGroup.visible) return;
  arcInnerLens.rotation.z += dt * (0.8 + audio.level * 1.5) * speedMultiplier;
  arcCoreLight.rotation.z -= dt * (0.4 + audio.level) * speedMultiplier;
  const pulse = 1.0 + (audio.bass * 0.4) + Math.sin(t * 3.0) * 0.08;
  arcReactorGroup.scale.setScalar(scaleMultiplier * pulse);
}

/* ---------- 3D Custom Photo Hologram Entity ---------- */
let customPhotoGroup = null;
let customPhotoFrontMat = null;
let customPhotoGlowRing = null;
let customPhotoBody = null;
let customPhotoCanvasTex = null;

function buildCustomPhotoMesh() {
  customPhotoGroup = new THREE.Group();
  customPhotoGroup.visible = false;

  const defaultCanvas = document.createElement("canvas");
  defaultCanvas.width = 256;
  defaultCanvas.height = 256;
  const ctx = defaultCanvas.getContext("2d");
  const grad = ctx.createLinearGradient(0, 0, 256, 256);
  grad.addColorStop(0, "#0284c7");
  grad.addColorStop(0.5, "#6366f1");
  grad.addColorStop(1, "#a855f7");
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(128, 128, 122, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = "#38bdf8";
  ctx.lineWidth = 6;
  ctx.stroke();
  ctx.fillStyle = "#ffffff";
  ctx.font = "bold 96px sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("3D", 128, 128);

  customPhotoCanvasTex = new THREE.CanvasTexture(defaultCanvas);

  customPhotoFrontMat = new THREE.MeshStandardMaterial({
    map: customPhotoCanvasTex,
    roughness: 0.30,
    metalness: 0.20,
    transparent: true
  });

  const rimMat = new THREE.MeshStandardMaterial({
    color: 0x1e293b,
    metalness: 0.90,
    roughness: 0.20
  });

  const glowBezelMat = new THREE.MeshBasicMaterial({
    color: 0x38bdf8,
    transparent: true,
    opacity: 0.95
  });

  const backMat = new THREE.MeshStandardMaterial({
    color: 0x090d16,
    metalness: 0.85,
    roughness: 0.35
  });

  // Front Photo Disc
  const frontMesh = new THREE.Mesh(new THREE.CircleGeometry(1.10, 48), customPhotoFrontMat);
  frontMesh.position.z = 0.082;
  customPhotoGroup.add(frontMesh);

  // Outer Glowing Bezel Ring
  const glowRingGeom = new THREE.TorusGeometry(1.12, 0.038, 16, 64);
  customPhotoGlowRing = new THREE.Mesh(glowRingGeom, glowBezelMat);
  customPhotoGlowRing.position.z = 0.083;
  customPhotoGroup.add(customPhotoGlowRing);

  // Rim Body Cylinder
  const bodyGeom = new THREE.CylinderGeometry(1.10, 1.10, 0.16, 48);
  bodyGeom.rotateX(Math.PI / 2);
  customPhotoBody = new THREE.Mesh(bodyGeom, rimMat);
  customPhotoGroup.add(customPhotoBody);

  // Back Face (Engraved Circuit Core)
  const backMesh = new THREE.Mesh(new THREE.CircleGeometry(1.10, 48), backMat);
  backMesh.rotation.y = Math.PI;
  backMesh.position.z = -0.082;
  customPhotoGroup.add(backMesh);

  const backCoreRing = new THREE.Mesh(new THREE.RingGeometry(0.2, 0.65, 24), glowBezelMat);
  backCoreRing.rotation.y = Math.PI;
  backCoreRing.position.z = -0.083;
  customPhotoGroup.add(backCoreRing);

  scene.add(customPhotoGroup);
}

function updateCustomPhotoMesh(t, dt) {
  if (!customPhotoGroup || !customPhotoGroup.visible) return;
  const pulse = 1.0 + (audio.bass * 0.3) + Math.sin(t * 2.8) * 0.06;
  customPhotoGroup.scale.setScalar(scaleMultiplier * pulse);
  customPhotoGroup.position.y = Math.sin(t * 2.2) * 0.06;
  customPhotoGroup.rotation.y = Math.sin(t * 1.5) * 0.45 + velY * 0.3;
  customPhotoGroup.rotation.x = Math.cos(t * 1.2) * 0.18 + velX * 0.3;
}

let customPhotoLoaded = false;

function applyCustomPhotoTexture(base64) {
  if (!base64 || !customPhotoFrontMat) return;
  const img = new Image();
  img.crossOrigin = "anonymous";
  img.onload = function() {
    const tex = new THREE.Texture(img);
    tex.needsUpdate = true;
    tex.generateMipmaps = true;
    tex.minFilter = THREE.LinearMipmapLinearFilter;
    tex.magFilter = THREE.LinearFilter;
    customPhotoFrontMat.map = tex;
    customPhotoFrontMat.needsUpdate = true;
    customPhotoLoaded = true;
  };
  img.src = base64;
}

function loadCustomPhotoFromBridge() {
  if (entityType !== "custom_3d") return false;
  if (!window.Jarvis3DModelBridge) return false;
  try {
    if (window.Jarvis3DModelBridge.hasCustomAvatar && window.Jarvis3DModelBridge.hasCustomAvatar()) {
      const b64 = window.Jarvis3DModelBridge.getCustomAvatarBase64();
      if (b64 && b64.length > 20) {
        applyCustomPhotoTexture(b64);
        return true;
      }
    }
  } catch (e) {
    console.warn("Bridge photo load warning:", e);
  }
  return false;
}

/* =========================================================================
   UNIVERSAL HUMANOID ANIMATION ENGINE & COMPATIBILITY LAYER
   - Automatically detects skeletal joints (Mixamo, ReadyPlayerMe, VRM, Rigify, Bip01)
   - Procedural kinematics for Idle, Listening, Thinking, Speaking, Wave, Success, Failed
   - Morph target blend shape animation (Blinking, Lip-sync via real-time audio)
   - Graceful fallback & telemetry diagnostics for static unrigged meshes
   ========================================================================= */
class UniversalHumanoidEngine {
  constructor(rootObject, animations) {
    this.root = rootObject;
    this.animations = animations || [];
    this.bones = {};
    this.restRotations = {};
    this.restPositions = {};
    this.morphMeshes = [];
    this.morphIndicesList = [];
    this.mixer = null;
    this.actions = {};
    this.activeAction = null;
    this.activeActionName = "idle";
    this.isRigged = false;
    this.hasMorphTargets = false;
    this.hasClips = false;
    this.mappedBonesList = [];
    this.diagnostics = {};
    this.curGazeYaw = 0;
    this.curGazePitch = 0;
    this.curGazeRoll = 0;
    this.livingBreath = 0;
    this.livingSway = 0;
    this.livingNodX = 0;
    this.livingNodY = 0;

    this.init();
    if (this.animations && this.animations.length > 0) {
      this.setAnimations(this.animations);
    }
  }

  init() {
    const BONE_PATTERNS = {
      hips: /(hips|pelvis|bip\d*_pelvis|root_bone|mixamorig:?hips|j_bip_c_hips)/i,
      spine: /(spine$|spine1|lower_spine|mixamorig:?spine$|j_bip_c_spine)/i,
      chest: /(chest|upperchest|spine2|mixamorig:?spine1|mixamorig:?spine2|j_bip_c_chest|j_bip_c_upperchest)/i,
      neck: /(neck|mixamorig:?neck|j_bip_c_neck)/i,
      head: /(head|mixamorig:?head|j_bip_c_head)/i,
      leftShoulder: /(leftshoulder|shoulder_l|l_shoulder|mixamorig:?leftshoulder|j_bip_l_shoulder)/i,
      leftUpperArm: /(leftarm|leftupperarm|arm_l|upperarm_l|l_arm|mixamorig:?leftarm|j_bip_l_upperarm)/i,
      leftForearm: /(leftforearm|forearm_l|lowerarm_l|l_forearm|mixamorig:?leftforearm|j_bip_l_lowerarm)/i,
      leftHand: /(lefthand|hand_l|l_hand|mixamorig:?lefthand|j_bip_l_hand)/i,
      rightShoulder: /(rightshoulder|shoulder_r|r_shoulder|mixamorig:?rightshoulder|j_bip_r_shoulder)/i,
      rightUpperArm: /(rightarm|rightupperarm|arm_r|upperarm_r|r_arm|mixamorig:?rightarm|j_bip_r_upperarm)/i,
      rightForearm: /(rightforearm|forearm_r|lowerarm_r|r_forearm|mixamorig:?rightforearm|j_bip_r_lowerarm)/i,
      rightHand: /(righthand|hand_r|r_hand|mixamorig:?righthand|j_bip_r_hand)/i,
      leftThigh: /(leftupleg|leftthigh|thigh_l|upperleg_l|l_leg|mixamorig:?leftupleg|j_bip_l_upperleg)/i,
      leftCalf: /(leftleg|leftcalf|calf_l|lowerleg_l|l_calf|leftshin|mixamorig:?leftleg|j_bip_l_lowerleg)/i,
      leftFoot: /(leftfoot|foot_l|l_foot|mixamorig:?leftfoot|j_bip_l_foot)/i,
      rightThigh: /(rightupleg|rightthigh|thigh_r|upperleg_r|r_leg|mixamorig:?rightupleg|j_bip_r_upperleg)/i,
      rightCalf: /(rightleg|rightcalf|calf_r|lowerleg_r|r_calf|rightshin|mixamorig:?rightleg|j_bip_r_lowerleg)/i,
      rightFoot: /(rightfoot|foot_r|r_foot|mixamorig:?rightfoot|j_bip_r_foot)/i
    };

    let totalMeshes = 0;
    const self = this;

    this.root.traverse(function(child) {
      if (child.isMesh) {
        totalMeshes++;
        if (child.morphTargetDictionary && Object.keys(child.morphTargetDictionary).length > 0) {
          self.morphMeshes.push(child);
          self.hasMorphTargets = true;

          const dict = child.morphTargetDictionary;
          const entry = { mesh: child, mouthA: [], mouthO: [], mouthE: [], blink: [], joy: [] };
          for (const [k, idx] of Object.entries(dict)) {
            const lk = k.toLowerCase();
            if (lk.includes("fcl_mth_a") || lk === "aa" || lk.includes("mouthopen") || lk.includes("jawopen") || lk === "viseme_aa") {
              entry.mouthA.push(idx);
            } else if (lk.includes("fcl_mth_o") || lk.includes("fcl_mth_u") || lk === "oh" || lk.includes("viseme_o")) {
              entry.mouthO.push(idx);
            } else if (lk.includes("fcl_mth_e") || lk.includes("fcl_mth_i") || lk === "ee" || lk.includes("viseme_e")) {
              entry.mouthE.push(idx);
            } else if (lk.includes("fcl_eye_close") || lk === "blink" || lk.includes("eyeblink")) {
              entry.blink.push(idx);
            } else if (lk.includes("fcl_all_joy") || lk.includes("fcl_mth_joy") || lk.includes("smile") || lk === "happy" || lk === "joy") {
              entry.joy.push(idx);
            }
          }
          self.morphIndicesList.push(entry);
        }
      }

      const name = child.name || "";
      for (const [key, regex] of Object.entries(BONE_PATTERNS)) {
        if (!self.bones[key] && regex.test(name)) {
          self.bones[key] = child;
          self.restRotations[key] = child.rotation.clone();
          self.restPositions[key] = child.position.clone();
          self.mappedBonesList.push(key);
          break;
        }
      }
    });

    if (this.mappedBonesList.length >= 3 || this.bones.head || this.bones.leftUpperArm || this.bones.hips) {
      this.isRigged = true;
    } else {
      this.setupKinematicDeformer();
    }

    this.updateDiagnostics(totalMeshes);
  }

  setAnimations(animations) {
    if (!animations || animations.length === 0) return;
    this.animations = animations;
    if (!this.mixer) {
      this.mixer = new THREE.AnimationMixer(this.root);
    }
    for (let i = 0; i < animations.length; i++) {
      const clip = animations[i];
      const rawName = (clip.name || "").toLowerCase();
      try {
        // Retargeting / Clean-Room Track Filtering:
        // Keep ONLY skeletal joint rotation (.quaternion/.rotation) tracks for bones that exist in this model.
        // Discarding translation and scale tracks preserves rest-pose bone socket offsets,
        // preventing bone displacement, joint stretching, or T-pose dislocation.
        const cleanTracks = [];
        for (let t = 0; t < clip.tracks.length; t++) {
          const track = clip.tracks[t];
          if (!track.name.endsWith('.quaternion') && !track.name.endsWith('.rotation')) continue;
          const boneName = track.name.split('.')[0];
          if (this.root.getObjectByName(boneName)) {
            cleanTracks.push(track);
          }
        }
        const cleanClip = new THREE.AnimationClip(clip.name, clip.duration, cleanTracks.length > 0 ? cleanTracks : clip.tracks);
        const action = this.mixer.clipAction(cleanClip);
        action.setLoop(THREE.LoopRepeat);
        this.actions[rawName] = action;
        if (rawName.includes("idle")) this.actions["idle"] = action;
        if (rawName.includes("wave")) { action.setLoop(THREE.LoopOnce); action.clampWhenFinished = true; this.actions["wave"] = action; }
        if (rawName.includes("shrug")) { action.setLoop(THREE.LoopOnce); action.clampWhenFinished = true; this.actions["shrug"] = action; }
        if (rawName.includes("talking_0") || rawName === "talking0") this.actions["talking_0"] = action;
        if (rawName.includes("talking_1") || rawName === "talking1") this.actions["talking_1"] = action;
        if (rawName.includes("talking_2") || rawName === "talking2") this.actions["talking_2"] = action;
        if (rawName.includes("talking") && !this.actions["talking_0"]) this.actions["talking_0"] = action;
        if (rawName.includes("laugh")) this.actions["laughing"] = action;
        if (rawName.includes("angry")) this.actions["angry"] = action;
        if (rawName.includes("cry")) this.actions["crying"] = action;
        if (rawName.includes("rumba") || rawName.includes("dance")) this.actions["rumba"] = action;
        if (rawName.includes("terrif") || rawName.includes("fear")) this.actions["terrified"] = action;
      } catch (err) {
        console.warn("Error creating clip action for", clip.name, err);
      }
    }
    this.hasClips = Object.keys(this.actions).length > 0;
    this.fadeToAction("idle", 0.1);
    this.updateDiagnostics();
  }

  addAnimaMotion(name, clip, sourceScene) {
    if (!this.mixer) this.mixer = new THREE.AnimationMixer(this.root);
    const BONE_TO_VRM = {
      'Hips': 'hips', 'Spine02': 'spine', 'Spine01': 'chest', 'Spine': 'upperChest',
      'neck': 'neck', 'Head': 'head',
      'LeftShoulder': 'leftShoulder', 'LeftArm': 'leftUpperArm', 'LeftForeArm': 'leftForearm', 'LeftHand': 'leftHand',
      'RightShoulder': 'rightShoulder', 'RightArm': 'rightUpperArm', 'RightForeArm': 'rightForearm', 'RightHand': 'rightHand',
      'LeftUpLeg': 'leftThigh', 'LeftLeg': 'leftCalf', 'LeftFoot': 'leftFoot',
      'RightUpLeg': 'rightThigh', 'RightLeg': 'rightCalf', 'RightFoot': 'rightFoot'
    };
    const retargetedTracks = [];
    for (const track of clip.tracks) {
      const parts = track.name.split('.');
      const rawBone = parts[0];
      const prop = parts.slice(1).join('.');
      if (prop !== "quaternion") continue; // Crucial: Only retarget skeletal joint rotations (quaternion) to prevent hips translation blowup
      const vrmKey = BONE_TO_VRM[rawBone];
      const targetBoneNode = vrmKey ? this.bones[vrmKey] : (this.root.getObjectByName(rawBone));
      if (targetBoneNode) {
        const cloned = track.clone();
        cloned.name = targetBoneNode.name + '.' + prop;
        retargetedTracks.push(cloned);
      }
    }
    if (retargetedTracks.length > 0) {
      const retargetedClip = new THREE.AnimationClip(name, clip.duration, retargetedTracks);
      const action = this.mixer.clipAction(retargetedClip);
      action.setLoop(THREE.LoopOnce);
      action.clampWhenFinished = true;
      this.actions[name] = action;
      this.hasClips = true;
      console.log("Added Anima motion clip:", name, "tracks:", retargetedTracks.length);
    }
  }

  fadeToAction(name, duration) {
    duration = (duration !== undefined && duration !== null) ? duration : 0.35;
    if (!this.mixer) return;
    const targetAction = this.actions[name] || this.actions["idle"];
    if (!targetAction) return;

    if (this.activeAction === targetAction) {
      if (!targetAction.isRunning()) targetAction.play();
      return;
    }

    const prevAction = this.activeAction;
    this.activeAction = targetAction;
    this.activeActionName = name;

    targetAction.reset();
    targetAction.setEffectiveTimeScale(1);
    targetAction.setEffectiveWeight(1);
    targetAction.clampWhenFinished = false;

    if (prevAction && prevAction !== targetAction) {
      prevAction.crossFadeTo(targetAction, duration, true);
    }
    targetAction.play();
  }

  updateDiagnostics(meshCount) {
    this.diagnostics = {
      isRigged: this.isRigged,
      rigType: this.isRigged ? (this.mappedBonesList.length >= 10 ? "Full Humanoid Armature" : "Partial Humanoid Rig") : "GPU Kinematic Humanoid (T-Pose Lowered & Animated)",
      meshCount: meshCount !== undefined ? meshCount : (this.diagnostics.meshCount || 0),
      boneCount: this.mappedBonesList.length,
      mappedBones: this.mappedBonesList,
      hasAnimations: this.hasClips || (this.animations && this.animations.length > 0),
      animationClipsCount: this.animations ? this.animations.length : 0,
      activeClip: this.activeActionName,
      hasMorphTargets: this.hasMorphTargets,
      statusMessage: this.isRigged
        ? "Rigged Humanoid Armature Active (" + this.mappedBonesList.length + " joints mapped). Skeletal animations (" + (this.animations ? this.animations.length : 0) + " clips) & ARKit facial visemes active."
        : "Kinematic Humanoid Engine active. Fallback vertex deformation active."
    };

    console.log("UniversalHumanoidEngine diagnostics:", this.diagnostics);

    if (window.Jarvis3DModelBridge && typeof window.Jarvis3DModelBridge.reportModelDiagnostics === "function") {
      try {
        window.Jarvis3DModelBridge.reportModelDiagnostics(JSON.stringify(this.diagnostics));
      } catch (err) {
        console.warn("Could not report diagnostics to bridge:", err);
      }
    }
  }

  setupKinematicDeformer() {
    this.uniformList = [];
    this.curArmAngleR = 1.15;
    this.curArmAngleL = -1.15;
    this.curForearmR = 0;
    this.curForearmL = 0;
    this.curHeadYaw = 0;
    this.curHeadPitch = 0;
    this.curHeadRoll = 0;
    this.curChestBreath = 0;
    this.curLegShift = 0;

    const self = this;
    const vertexPrefix = `
uniform float uKinematicTime;
uniform float uArmAngleR;
uniform float uArmAngleL;
uniform float uForearmR;
uniform float uForearmL;
uniform float uHeadYaw;
uniform float uHeadPitch;
uniform float uHeadRoll;
uniform float uChestBreath;
uniform float uLegShift;

vec3 kRotX(vec3 p, vec3 piv, float ang) {
  float c = cos(ang), s = sin(ang);
  vec3 d = p - piv;
  return vec3(d.x, d.y * c - d.z * s, d.y * s + d.z * c) + piv;
}
vec3 kRotY(vec3 p, vec3 piv, float ang) {
  float c = cos(ang), s = sin(ang);
  vec3 d = p - piv;
  return vec3(d.x * c + d.z * s, d.y, -d.x * s + d.z * c) + piv;
}
vec3 kRotZ(vec3 p, vec3 piv, float ang) {
  float c = cos(ang), s = sin(ang);
  vec3 d = p - piv;
  return vec3(d.x * c - d.y * s, d.x * s + d.y * c, d.z) + piv;
}
`;

    const vertexDeformLogic = `
#include <begin_vertex>
float kWR = smoothstep(0.18, 0.28, position.z);
if (kWR > 0.0) {
  vec3 pivR = vec3(0.0, 0.44, 0.22);
  vec3 rArm = kRotX(transformed, pivR, uArmAngleR);
  float kWForearmR = smoothstep(0.40, 0.52, position.z);
  rArm = kRotZ(rArm, pivR, uForearmR * kWForearmR);
  transformed = mix(transformed, rArm, kWR);
}
float kWL = smoothstep(-0.18, -0.28, position.z);
if (kWL > 0.0) {
  vec3 pivL = vec3(0.0, 0.44, -0.22);
  vec3 lArm = kRotX(transformed, pivL, uArmAngleL);
  float kWForearmL = smoothstep(-0.40, -0.52, position.z);
  lArm = kRotZ(lArm, pivL, uForearmL * kWForearmL);
  transformed = mix(transformed, lArm, kWL);
}
float kWH = smoothstep(0.46, 0.53, position.y);
if (kWH > 0.0) {
  vec3 pivHead = vec3(0.0, 0.48, 0.0);
  vec3 hPos = kRotY(transformed, pivHead, uHeadYaw);
  hPos = kRotZ(hPos, pivHead, uHeadPitch);
  hPos = kRotX(hPos, pivHead, uHeadRoll);
  transformed = mix(transformed, hPos, kWH);
}
float kWChest = smoothstep(-0.15, 0.15, position.y) * (1.0 - smoothstep(0.35, 0.50, position.y));
transformed.x += uChestBreath * kWChest * 0.012;
transformed.z += uChestBreath * kWChest * 0.008 * sign(position.z);
float kWLegs = smoothstep(-0.05, -0.25, position.y);
transformed.z += uLegShift * kWLegs * 0.012;
`;

    const normalDeformLogic = `
#include <beginnormal_vertex>
float knWR = smoothstep(0.18, 0.28, position.z);
if (knWR > 0.0) {
  vec3 rNormR = kRotX(objectNormal, vec3(0.0), uArmAngleR);
  objectNormal = mix(objectNormal, rNormR, knWR);
}
float knWL = smoothstep(-0.18, -0.28, position.z);
if (knWL > 0.0) {
  vec3 rNormL = kRotX(objectNormal, vec3(0.0), uArmAngleL);
  objectNormal = mix(objectNormal, rNormL, knWL);
}
float knWH = smoothstep(0.46, 0.53, position.y);
if (knWH > 0.0) {
  vec3 hNorm = kRotY(objectNormal, vec3(0.0), uHeadYaw);
  hNorm = kRotZ(hNorm, vec3(0.0), uHeadPitch);
  hNorm = kRotX(hNorm, vec3(0.0), uHeadRoll);
  objectNormal = mix(objectNormal, hNorm, knWH);
}
`;

    const processedMaterials = new Set();
    this.root.traverse(function(child) {
      if (child.isMesh && child.material) {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(function(mat) {
          if (processedMaterials.has(mat)) return;
          processedMaterials.add(mat);

          const uniforms = {
            uKinematicTime: { value: 0 },
            uArmAngleR: { value: 1.15 },
            uArmAngleL: { value: -1.15 },
            uForearmR: { value: 0 },
            uForearmL: { value: 0 },
            uHeadYaw: { value: 0 },
            uHeadPitch: { value: 0 },
            uHeadRoll: { value: 0 },
            uChestBreath: { value: 0 },
            uLegShift: { value: 0 }
          };
          self.uniformList.push(uniforms);

          mat.customProgramCacheKey = function() {
            return "jett_kinematic_deformer_v3";
          };

          const origOnBeforeCompile = mat.onBeforeCompile;
          mat.onBeforeCompile = function(shader, renderer) {
            if (origOnBeforeCompile) origOnBeforeCompile(shader, renderer);
            Object.assign(shader.uniforms, uniforms);
            shader.vertexShader = shader.vertexShader.replace(
              '#include <common>',
              '#include <common>\n' + vertexPrefix
            );
            shader.vertexShader = shader.vertexShader.replace(
              '#include <begin_vertex>',
              vertexDeformLogic
            );
            shader.vertexShader = shader.vertexShader.replace(
              '#include <beginnormal_vertex>',
              normalDeformLogic
            );
          };
          mat.needsUpdate = true;
        });
      }
    });
  }

  interrupt() {
    // REDMAGIC Barge-In / Interruption:
    // Instantly collapse mouth shapes to zero so the character doesn't freeze with open mouth
    if (this.hasMorphTargets) {
      for (const item of this.morphIndicesList) {
        const infl = item.mesh.morphTargetInfluences;
        if (!infl) continue;
        for (const idx of item.mouthA) infl[idx] = 0;
        for (const idx of item.mouthO) infl[idx] = 0;
        for (const idx of item.mouthE) infl[idx] = 0;
      }
    }
    // Fade speech animation immediately back to attentive listening or idle
    if (this.hasClips && this.mixer) {
      this.fadeToAction("idle", 0.15);
    }
    this.curThinkingWeight = 0;
  }

  update(dt, t, state, audio, gazeX, gazeY, activeEmote, emoteTimer) {
    // 0. Living Layer Kinematics (Breathing, Posture Sway, Micro-nods)
    // Undo previous living offsets for un-animated procedural rigs so they don't accumulate
    if (!this.hasClips && this.isRigged) {
      if (this.bones.chest) this.bones.chest.rotation.x -= this.livingBreath;
      if (this.bones.spine) this.bones.spine.rotation.z -= this.livingSway;
      if (this.bones.head) {
        this.bones.head.rotation.x -= this.livingNodX;
        this.bones.head.rotation.y -= this.livingNodY;
      }
    }

    // 1. Determine & cross-fade active animation clip
    if (this.hasClips && this.mixer) {
      let desiredClip = "idle";
      const isSpeaking = (state === "speaking");
      const isListening = (state === "listening");
      const isThinking = (state === "thinking");

      if (activeEmote === "rumba" || activeEmote === "dance") {
        desiredClip = "rumba";
      } else if (activeEmote === "laugh" || activeEmote === "happy" || activeEmote === "joy") {
        desiredClip = "laughing";
      } else if (activeEmote === "angry") {
        desiredClip = "angry";
      } else if (activeEmote === "crying" || activeEmote === "sad") {
        desiredClip = "crying";
      } else if (activeEmote === "terrified" || activeEmote === "fear") {
        desiredClip = "terrified";
      } else if (isSpeaking) {
        // Cycle natural conversational talking gestures
        const talkCycle = Math.floor((t / 2.6) % 3);
        desiredClip = talkCycle === 1 ? "talking_1" : (talkCycle === 2 ? "talking_2" : "talking_0");
      } else {
        desiredClip = "idle";
      }

      this.fadeToAction(desiredClip, 0.40);
      this.mixer.update(dt);
    }

    // 2. Facial Morph Targets: Real-time Audio Lip Sync & Natural Blinking
    // STRICT SEPARATION: Microphone amplitude MUST NEVER trigger speech lip sync!
    // Lip sync is ONLY active when state === "speaking"
    if (this.hasMorphTargets) {
      const isTalking = (state === "speaking");
      const rawVol = (audio && audio.level > 0.015) ? audio.level : 0;
      const mouthOpen = isTalking ? Math.min(1.0, (rawVol > 0.015 ? rawVol * 3.2 : 0.40) + Math.abs(Math.sin(t * 11.5)) * 0.32) : 0;
      const visemeO = isTalking ? Math.min(0.85, Math.abs(Math.cos(t * 7.5)) * (rawVol > 0.015 ? rawVol * 2.6 : 0.30)) : 0;
      const visemeE = isTalking ? Math.min(0.75, Math.abs(Math.sin(t * 9.2)) * (rawVol > 0.015 ? rawVol * 2.0 : 0.22)) : 0;

      // Realistic human eyelid blinking: ~130ms blink duration every 3.8s
      const blinkCycle = t % 3.8;
      const isBlinking = blinkCycle < 0.13 ? 1.0 : 0.0;
      const gentleSmile = (activeEmote === "joy" || activeEmote === "success" || activeEmote === "teach" || activeEmote === "blush") ? 0.70 : 0.15;

      for (const item of this.morphIndicesList) {
        const infl = item.mesh.morphTargetInfluences;
        if (!infl) continue;
        for (const idx of item.mouthA) infl[idx] = THREE.MathUtils.lerp(infl[idx], mouthOpen, dt * 26);
        for (const idx of item.mouthO) infl[idx] = THREE.MathUtils.lerp(infl[idx], visemeO, dt * 22);
        for (const idx of item.mouthE) infl[idx] = THREE.MathUtils.lerp(infl[idx], visemeE, dt * 22);
        for (const idx of item.blink)  infl[idx] = THREE.MathUtils.lerp(infl[idx], isBlinking, dt * 32);
        for (const idx of item.joy)    infl[idx] = THREE.MathUtils.lerp(infl[idx], gentleSmile, dt * 10);
      }
    }

    // 3. Additive Head Gaze Tracking, Emotional Tilts & Conversational Cadence
    if (this.isRigged && this.bones.head) {
      const gazeYaw = (typeof gazeX !== "undefined" ? gazeX : 0) * 0.38;
      const gazePitch = -(typeof gazeY !== "undefined" ? gazeY : 0) * 0.26;
      let emoteHeadTiltZ = 0, emoteHeadPitchX = 0;

      if (activeEmote === "curious") {
        emoteHeadTiltZ = 0.16;
        emoteHeadPitchX = -0.06;
      } else if (state === "listening") {
        emoteHeadTiltZ = 0.10;
        emoteHeadPitchX = -0.05;
      } else if (activeEmote === "wave") {
        emoteHeadTiltZ = 0.08;
      } else if (activeEmote === "teach" || activeEmote === "nod") {
        emoteHeadPitchX = Math.sin(t * 12.0) * 0.15;
      } else if (activeEmote === "joy" || activeEmote === "success") {
        emoteHeadTiltZ = -0.08;
        emoteHeadPitchX = -0.04;
      } else if (state === "thinking") {
        emoteHeadTiltZ = -0.12;
        emoteHeadPitchX = -0.14;
      }

      const speechNod = (state === "speaking") ? Math.sin(t * 6.5) * (0.04 + audio.level * 0.08) : 0;

      this.curGazeYaw = THREE.MathUtils.lerp(this.curGazeYaw, gazeYaw, dt * 5.0);
      this.curGazePitch = THREE.MathUtils.lerp(this.curGazePitch, gazePitch + emoteHeadPitchX + speechNod, dt * 5.0);
      this.curGazeRoll = THREE.MathUtils.lerp(this.curGazeRoll, emoteHeadTiltZ, dt * 5.0);

      this.bones.head.rotation.y += this.curGazeYaw;
      this.bones.head.rotation.x += this.curGazePitch;
      this.bones.head.rotation.z += this.curGazeRoll;
    }

    // 4. Additive Torso & Arm Kinematics for Listening & Thinking (REDMAGIC Style)
    if (this.isRigged) {
      const isListening = (state === "listening");
      const isThinking = (state === "thinking");

      // Attentive torso forward lean when listening
      if (isListening && this.bones.chest) {
        this.bones.chest.rotation.x += 0.07;
      }

      // Thinking: Contemplative hand-to-chin gesture
      if (this.bones.rightUpperArm && this.bones.rightForearm) {
        if (isThinking) {
          this.curThinkingWeight = THREE.MathUtils.lerp(this.curThinkingWeight || 0, 1.0, dt * 5.0);
        } else {
          this.curThinkingWeight = THREE.MathUtils.lerp(this.curThinkingWeight || 0, 0.0, dt * 6.0);
        }
        if (this.curThinkingWeight > 0.01) {
          const targetArmX = -0.65;
          const targetArmZ = -0.75;
          const targetForearmZ = -1.25;
          this.bones.rightUpperArm.rotation.x = THREE.MathUtils.lerp(this.bones.rightUpperArm.rotation.x, targetArmX, this.curThinkingWeight);
          this.bones.rightUpperArm.rotation.z = THREE.MathUtils.lerp(this.bones.rightUpperArm.rotation.z, targetArmZ, this.curThinkingWeight);
          this.bones.rightForearm.rotation.z = THREE.MathUtils.lerp(this.bones.rightForearm.rotation.z, targetForearmZ, this.curThinkingWeight);
        }
      }
    }

    // 5. Guaranteed Additive Arm Wave & Shrug Gestures
    if (this.isRigged && this.bones.rightUpperArm && activeEmote === "wave") {
      const wavePhase = Math.sin(t * 14.0);
      this.bones.rightUpperArm.rotation.z = -1.60;
      this.bones.rightUpperArm.rotation.x = -0.40;
      if (this.bones.rightForearm) {
        this.bones.rightForearm.rotation.z = -0.80 + wavePhase * 0.40;
      }
    }
    if (this.isRigged && (activeEmote === "shrug" || activeEmote === "failed")) {
      if (this.bones.leftUpperArm && this.bones.rightUpperArm) {
        this.bones.leftUpperArm.rotation.z = 0.55;
        this.bones.rightUpperArm.rotation.z = -0.55;
        if (this.bones.leftForearm) this.bones.leftForearm.rotation.z = 0.70;
        if (this.bones.rightForearm) this.bones.rightForearm.rotation.z = -0.70;
      }
      if (this.bones.head) {
        this.bones.head.rotation.z = 0.14;
      }
    }

    // 6. Apply Anima Living Layer Kinematics (Breathing, Weight Shift Sway, Drift)
    if (this.isRigged) {
      this.livingBreath = Math.sin(t * 1.9) * 0.012;
      this.livingSway = Math.sin(t * 0.45) * 0.012 + Math.sin(t * 0.17) * 0.008;
      this.livingNodX = Math.sin(t * 0.31) * 0.02;
      this.livingNodY = Math.sin(t * 0.23 + 1) * 0.035;

      if (this.bones.chest) this.bones.chest.rotation.x += this.livingBreath;
      if (this.bones.spine) this.bones.spine.rotation.z += this.livingSway;
      if (this.bones.head) {
        this.bones.head.rotation.x += this.livingNodX;
        this.bones.head.rotation.y += this.livingNodY;
      }
    }

    // GPU Kinematic Humanoid Deformation for Unrigged Models (e.g. Jett sculpt)
    if (!this.isRigged && this.uniformList && this.uniformList.length > 0) {
      const isSpeaking = (state === "speaking") || (audio.level > 0.04);
      const isListening = (state === "listening");
      const isThinking = (state === "thinking");
      const breath = Math.sin(t * 2.2);

      let tgtArmAngleR = 1.15;
      let tgtArmAngleL = -1.15;
      let tgtForearmR = 0;
      let tgtForearmL = 0;
      let tgtHeadYaw = (typeof gazeX !== "undefined" ? gazeX : 0) * 0.35;
      let tgtHeadPitch = -(typeof gazeY !== "undefined" ? gazeY : 0) * 0.25;
      let tgtHeadRoll = 0;
      let tgtChestBreath = breath;
      let tgtLegShift = Math.sin(t * 0.7);

      if (activeEmote === "wave") {
        tgtArmAngleR = -0.35;
        tgtForearmR = Math.sin(t * 12.0) * 0.45;
        tgtHeadRoll = 0.10;
        tgtHeadPitch = -0.05;
      } else if (activeEmote === "nod") {
        tgtHeadPitch = Math.sin(t * 10.0) * 0.18;
        tgtArmAngleR = 0.85;
        tgtArmAngleL = -0.85;
        tgtForearmR = -0.40;
        tgtForearmL = 0.40;
      } else if (activeEmote === "curious") {
        tgtHeadRoll = 0.22;
        tgtHeadYaw = 0.15;
        tgtHeadPitch = -0.08;
        tgtArmAngleR = 0.60;
        tgtForearmR = -0.65;
      } else if (activeEmote === "blush") {
        tgtHeadRoll = -0.14;
        tgtHeadPitch = 0.10;
        tgtArmAngleR = 0.90;
        tgtArmAngleL = -0.90;
        tgtForearmR = -0.50;
        tgtForearmL = 0.50;
      } else if (activeEmote === "success") {
        tgtArmAngleR = -0.30;
        tgtArmAngleL = 0.30;
        tgtHeadPitch = -0.10;
      } else if (activeEmote === "failed") {
        tgtArmAngleR = 0.70;
        tgtArmAngleL = -0.70;
        tgtForearmR = -0.50;
        tgtForearmL = 0.50;
        tgtHeadRoll = 0.14;
      } else if (isThinking) {
        tgtArmAngleR = 0.25;
        tgtForearmR = -0.85;
        tgtHeadRoll = -0.14;
        tgtHeadPitch = -0.12;
      } else if (isSpeaking) {
        const gR = Math.sin(t * 3.5) * 0.18;
        const gL = Math.cos(t * 3.0) * 0.16;
        tgtArmAngleR = 0.90 + gR;
        tgtArmAngleL = -0.90 + gL;
        tgtForearmR = -0.30 + gR * 0.5;
        tgtForearmL = 0.30 + gL * 0.5;
        tgtHeadPitch += Math.sin(t * 6.5) * (0.04 + audio.level * 0.08);
        tgtHeadYaw += Math.sin(t * 2.0) * 0.05;
      } else if (isListening) {
        tgtHeadRoll = 0.12;
        tgtHeadPitch = -0.08;
        tgtArmAngleR = 1.10;
        tgtArmAngleL = -1.10;
      } else {
        const armSway = Math.sin(t * 1.5) * 0.025;
        tgtArmAngleR = 1.15 + armSway;
        tgtArmAngleL = -1.15 - armSway;
        tgtHeadRoll = Math.sin(t * 0.9) * 0.02;
      }

      const lerpSpeed = (activeEmote === "wave" || activeEmote === "success") ? 8.0 : 5.0;
      this.curArmAngleR = THREE.MathUtils.lerp(this.curArmAngleR, tgtArmAngleR, dt * lerpSpeed);
      this.curArmAngleL = THREE.MathUtils.lerp(this.curArmAngleL, tgtArmAngleL, dt * lerpSpeed);
      this.curForearmR = THREE.MathUtils.lerp(this.curForearmR, tgtForearmR, dt * (activeEmote === "wave" ? 18.0 : lerpSpeed));
      this.curForearmL = THREE.MathUtils.lerp(this.curForearmL, tgtForearmL, dt * lerpSpeed);
      this.curHeadYaw = THREE.MathUtils.lerp(this.curHeadYaw, tgtHeadYaw, dt * 6.0);
      this.curHeadPitch = THREE.MathUtils.lerp(this.curHeadPitch, tgtHeadPitch, dt * 6.0);
      this.curHeadRoll = THREE.MathUtils.lerp(this.curHeadRoll, tgtHeadRoll, dt * 6.0);
      this.curChestBreath = tgtChestBreath;
      this.curLegShift = tgtLegShift;

      for (let i = 0; i < this.uniformList.length; i++) {
        const u = this.uniformList[i];
        u.uKinematicTime.value = t;
        u.uArmAngleR.value = this.curArmAngleR;
        u.uArmAngleL.value = this.curArmAngleL;
        u.uForearmR.value = this.curForearmR;
        u.uForearmL.value = this.curForearmL;
        u.uHeadYaw.value = this.curHeadYaw;
        u.uHeadPitch.value = this.curHeadPitch;
        u.uHeadRoll.value = this.curHeadRoll;
        u.uChestBreath.value = this.curChestBreath;
        u.uLegShift.value = this.curLegShift;
      }
    }
  }
}

function clearCustom3DModel() {
  if (customModelInner && customModelGroup) {
    customModelGroup.remove(customModelInner);
    customModelInner = null;
  }
  if (customModelMixer) {
    try { customModelMixer.stopAllAction(); } catch (_) {}
    customModelMixer = null;
  }
  if (customModelEngine) {
    customModelEngine = null;
  }
  customModelLoaded = false;
}

function fallbackToOrb() {
  clearCustom3DModel();
  if (pointsMesh) pointsMesh.visible = componentToggles.core;
  if (glow) glow.visible = componentToggles.glow;
  if (ring1) ring1.visible = componentToggles.rings && componentToggles.ring1;
  if (ring2) ring2.visible = componentToggles.rings && componentToggles.ring2;
  if (ring3) ring3.visible = componentToggles.rings && componentToggles.ring3;
  if (orbitPts) orbitPts.visible = componentToggles.orbitDust;
}

function onModelReady(object, animations) {
  if (!object) {
    fallbackToOrb();
    return;
  }
  clearCustom3DModel();

  let meshCount = 0;
  let isVRoid = false;

  object.traverse(function(child) {
    if (child.name && (child.name.startsWith("J_Bip_") || child.name.startsWith("j_bip_"))) {
      isVRoid = true;
    }
    if (child.isMesh) {
      meshCount++;
      child.castShadow = true;
      child.receiveShadow = true;
      child.frustumCulled = false;
      if (child.geometry && !child.geometry.attributes.normal) {
        try { child.geometry.computeVertexNormals(); } catch (_) {}
      }
      if (!child.material) {
        child.material = new THREE.MeshStandardMaterial({
          color: 0x38bdf8,
          metalness: 0.25,
          roughness: 0.40,
          side: THREE.DoubleSide
        });
      } else {
        const mats = Array.isArray(child.material) ? child.material : [child.material];
        mats.forEach(function(m) {
          m.side = THREE.DoubleSide;
          m.skinning = true;
          m.morphTargets = true;
          if (!m.map && m.color && m.color.r < 0.05 && m.color.g < 0.05 && m.color.b < 0.05) {
            m.color.setHex(0x94a3b8);
          }
          m.needsUpdate = true;
        });
      }
    }
  });

  if (window.Jarvis3DModelBridge && typeof window.Jarvis3DModelBridge.getModelCategory === "function") {
    try {
      if (window.Jarvis3DModelBridge.getModelCategory() === "hinata_anime") isVRoid = true;
    } catch (_) {}
  }

  const box = new THREE.Box3().setFromObject(object);
  const size = new THREE.Vector3();
  box.getSize(size);
  const center = new THREE.Vector3();
  box.getCenter(center);

  // Center model horizontally (X & Z) and place soles/feet at local Y = 0
  object.position.x = -center.x;
  object.position.y = -box.min.y;
  object.position.z = -center.z;

  // Face camera directly (+Z) - VRM/VRoid models default to -Z, 180 deg rotation faces the user
  object.rotation.y = Math.PI;

  const wrapper = new THREE.Group();
  wrapper.add(object);

  const maxDim = Math.max(size.x, size.y, size.z);
  const targetHeight = 2.65;
  const scaleFactor = targetHeight / (size.y > 0.001 ? size.y : (maxDim > 0.0001 ? maxDim : 1.0));
  wrapper.scale.set(scaleFactor, scaleFactor, scaleFactor);
  wrapper.position.set(0, 0, 0);

  customModelInner = wrapper;
  if (!customModelGroup) {
    buildCustomModelGroup();
  }
  customModelGroup.add(wrapper);
  customModelLoaded = true;
  customModelGroup.visible = (entityType === "custom_3d" || entityType === "ai_girl" || entityType === "hinata_anime");

  // Initialize Universal Humanoid Engine
  try {
    if (typeof UniversalHumanoidEngine !== "undefined") {
      customModelEngine = new UniversalHumanoidEngine(object, animations);
      if (customModelEngine.mixer) {
        customModelMixer = customModelEngine.mixer;
      }
    } else if (animations && animations.length > 0) {
      customModelMixer = new THREE.AnimationMixer(object);
      customModelMixer.clipAction(animations[0]).play();
    }

    // Load Anima motion library (.glb) for standard humanoid rigs without built-in animations
    if (!isVRoid && typeof THREE.GLTFLoader !== "undefined") {
      const animaMotions = [
        { name: "wave", url: "https://appassets.androidplatform.net/assets/motions/wave_290.glb" },
        { name: "shrug", url: "https://appassets.androidplatform.net/assets/motions/shrug_317.glb" },
        { name: "talk_expressive", url: "https://appassets.androidplatform.net/assets/motions/talk_314.glb" },
        { name: "idle_alt1", url: "https://appassets.androidplatform.net/assets/motions/idle_243.glb" },
        { name: "idle_alt2", url: "https://appassets.androidplatform.net/assets/motions/idle_249.glb" },
        { name: "idle_alt3", url: "https://appassets.androidplatform.net/assets/motions/idle_252.glb" }
      ];
      const loader = new THREE.GLTFLoader();
      animaMotions.forEach(function(m) {
        loader.load(
          m.url,
          function(gltf) {
            if (gltf.animations && gltf.animations.length > 0 && customModelEngine) {
              customModelEngine.addAnimaMotion(m.name, gltf.animations[0], gltf.scene);
            }
          },
          undefined,
          function(err) {
            console.warn("Could not load motion:", m.name, err);
          }
        );
      });
    }
  } catch (err) {
    console.warn("UniversalHumanoidEngine init error:", err);
  }

  if (customPhotoGroup) customPhotoGroup.visible = false;
  console.log("3D Model successfully staged. Meshes:", meshCount, "Rigged:", customModelEngine ? customModelEngine.isRigged : false, "VRoid:", isVRoid);
}

function parseAndDisplay3DModel(arrayBuffer, format) {
  format = (format || "glb").toLowerCase();
  clearCustom3DModel();

  try {
    if (format === "glb" || format === "gltf") {
      if (typeof THREE.GLTFLoader !== "undefined") {
        const loader = new THREE.GLTFLoader();
        loader.parse(arrayBuffer, "", function(gltf) {
          const sceneOrObject = gltf.scene || (gltf.scenes && gltf.scenes[0]) || gltf;
          onModelReady(sceneOrObject, gltf.animations);
        }, function(err) {
          console.error("GLTF parse error:", err);
          fallbackToOrb();
        });
      } else {
        fallbackToOrb();
      }
    } else if (format === "obj") {
      if (typeof THREE.OBJLoader !== "undefined") {
        const text = new TextDecoder().decode(arrayBuffer);
        const loader = new THREE.OBJLoader();
        const obj = loader.parse(text);
        onModelReady(obj, null);
      } else {
        fallbackToOrb();
      }
    } else if (format === "stl") {
      if (typeof THREE.STLLoader !== "undefined") {
        const loader = new THREE.STLLoader();
        const geometry = loader.parse(arrayBuffer);
        const material = new THREE.MeshStandardMaterial({
          color: 0x38bdf8,
          metalness: 0.35,
          roughness: 0.30,
          side: THREE.DoubleSide
        });
        const mesh = new THREE.Mesh(geometry, material);
        onModelReady(mesh, null);
      } else {
        fallbackToOrb();
      }
    } else if (format === "fbx") {
      if (typeof THREE.FBXLoader !== "undefined") {
        const loader = new THREE.FBXLoader();
        const obj = loader.parse(arrayBuffer, "");
        onModelReady(obj, obj.animations);
      } else {
        fallbackToOrb();
      }
    } else {
      fallbackToOrb();
    }
  } catch (e) {
    console.error("Error parsing 3D model:", e);
    fallbackToOrb();
  }
}

function loadCustom3DModelStream() {
  if (entityType !== "custom_3d" && entityType !== "ai_girl" && entityType !== "hinata_anime") return false;
  if (!window.Jarvis3DModelBridge) return false;
  try {
    if (!window.Jarvis3DModelBridge.hasCustom3DModel()) {
      clearCustom3DModel();
      return false;
    }
    const format = (window.Jarvis3DModelBridge.getModelFormat() || "glb").toLowerCase();
    const streamUrl = "https://appassets.androidplatform.net/active_3d_model?t=" + Date.now();
    console.log("Initiating native 3D stream load:", streamUrl, "format:", format);

    if (format === "glb" || format === "gltf") {
      if (typeof THREE.GLTFLoader !== "undefined") {
        const loader = new THREE.GLTFLoader();
        loader.load(
          streamUrl,
          function(gltf) {
            console.log("GLTF model streamed & parsed successfully!");
            const sceneOrObject = gltf.scene || (gltf.scenes && gltf.scenes[0]) || gltf;
            onModelReady(sceneOrObject, gltf.animations);
          },
          undefined,
          function(err) {
            console.warn("Stream GLTF load error, trying fallback:", err);
            loadCustom3DModelChunkFallback();
          }
        );
        return true;
      }
    } else if (format === "obj") {
      if (typeof THREE.OBJLoader !== "undefined") {
        const loader = new THREE.OBJLoader();
        loader.load(streamUrl, function(obj) { onModelReady(obj, null); });
        return true;
      }
    } else if (format === "stl") {
      if (typeof THREE.STLLoader !== "undefined") {
        const loader = new THREE.STLLoader();
        loader.load(streamUrl, function(geom) {
          const mat = new THREE.MeshStandardMaterial({ color: 0x38bdf8, metalness: 0.35, roughness: 0.30 });
          const mesh = new THREE.Mesh(geom, mat);
          onModelReady(mesh, null);
        });
        return true;
      }
    }
  } catch (e) {
    console.error("Error streaming 3D model:", e);
  }
  return false;
}

function loadCustom3DModelChunkFallback() {
  if (entityType !== "custom_3d" && entityType !== "ai_girl" && entityType !== "hinata_anime") return false;
  if (!window.Jarvis3DModelBridge) return false;
  try {
    if (!window.Jarvis3DModelBridge.hasCustom3DModel()) return false;
    const format = (window.Jarvis3DModelBridge.getModelFormat() || "glb").toLowerCase();
    const chunkCount = window.Jarvis3DModelBridge.getModelChunkCount(262144);
    if (chunkCount <= 0) {
      fallbackToOrb();
      return false;
    }

    let totalLen = 0;
    const byteArrays = [];
    for (let i = 0; i < chunkCount; i++) {
      const b64 = window.Jarvis3DModelBridge.getModelChunk(i, 262144);
      if (!b64) continue;
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      byteArrays.push(bytes);
      totalLen += bytes.length;
    }

    if (totalLen <= 0) {
      fallbackToOrb();
      return false;
    }

    const fullBuffer = new Uint8Array(totalLen);
    let offset = 0;
    for (let i = 0; i < byteArrays.length; i++) {
      fullBuffer.set(byteArrays[i], offset);
      offset += byteArrays[i].length;
    }

    parseAndDisplay3DModel(fullBuffer.buffer, format);
    return true;
  } catch (err) {
    console.error("Bridge model load error:", err);
    fallbackToOrb();
    return false;
  }
}

function loadCustom3DModelFromBridge() {
  return loadCustom3DModelStream();
}

    });

    } else if (companionStyle === "wisp") {

      subGroup.add(wispCore);

      const wingL = new THREE.Mesh(new THREE.RingGeometry(0.02, 0.10, 12), subMat);
      wingL.position.set(-0.10, 0.04, 0);
      wingL.rotation.y = 0.4;
      subGroup.add(wingL);

      const wingR = new THREE.Mesh(new THREE.RingGeometry(0.02, 0.10, 12), subMat);
      wingR.position.set(0.10, 0.04, 0);
      wingR.rotation.y = -0.4;
      subGroup.add(wingR);
    } else {

}

function updateCompanionFleet(t, dt) {
  if (!companionEntities || companionEntities.length === 0) return;
  const isInteracting = dragging || (Math.abs(velX) + Math.abs(velY) > 0.02);
  const boost = 1.0 + (audio.level * 1.2) + (state === "speaking" ? 0.35 : 0);

  for (let i = 0; i < companionEntities.length; i++) {
    const e = companionEntities[i];
    e.angle += dt * e.speed * boost * speedMultiplier;

    if (isInteracting) {
      e.scatter = THREE.MathUtils.lerp(e.scatter, 0.55, dt * 8);
    } else {
      e.scatter = THREE.MathUtils.lerp(e.scatter, 0.0, dt * 3);
    }

    const curR = (e.radius + e.scatter) * scaleMultiplier;
    e.mesh.position.x = Math.cos(e.angle) * curR;
    e.mesh.position.z = Math.sin(e.angle) * curR * 0.85;
    e.mesh.position.y = Math.sin(e.angle * 2.0 + e.phase) * 0.32 + (e.mesh.position.x * e.inclination);

    const s = scaleMultiplier * (1.0 + audio.bass * 0.45 + Math.sin(t * 3.5 + e.phase) * 0.07);
    e.mesh.scale.setScalar(s);
    e.mesh.rotation.y += dt * 2.0;
    e.mesh.rotation.z = Math.sin(t * 2.0 + e.phase) * 0.2;
  }
}

const audio={level:0,bass:0,high:0};
let actx=null,analyser=null,micStream=null,freq=null,micOn=false;
let externalAudioTime=0;
const extAudio={level:0,bass:0,high:0};

function setExternalAudio(level, bass, high){
  const l = Math.max(0, Math.min(1, Number(level) || 0));
  extAudio.level = l;
  extAudio.bass = Math.max(0, Math.min(1, bass !== undefined && bass !== null ? Number(bass) : l));
  extAudio.high = Math.max(0, Math.min(1, high !== undefined && high !== null ? Number(high) : l));
  externalAudioTime = performance.now();
}

function toast(m){const t=$("#toast");if(!t)return;t.textContent=m;t.classList.add("show");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("show"),2600);}
function updateMicUI(){const b=$("#mic");if(b){b.classList.toggle("on",micOn);b.textContent=micOn?"MIC ON":"MIC TEST";}}
async function startAudioReactive(){
  if(micOn) return true;
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    actx=new AC();if(actx.state==="suspended") await actx.resume();
    analyser=actx.createAnalyser();analyser.fftSize=256;analyser.smoothingTimeConstant=.8;
    actx.createMediaStreamSource(micStream).connect(analyser);
    freq=new Uint8Array(analyser.frequencyBinCount);micOn=true;updateMicUI();return true;
  }catch(e){micOn=false;updateMicUI();toast("Microphone unavailable — using simulated audio");return false;}
}
function stopAudioReactive(){
  if(micStream) micStream.getTracks().forEach(t=>t.stop());
  if(actx&&actx.close) actx.close().catch(()=>{});
  micStream=null;actx=null;analyser=null;micOn=false;updateMicUI();
}
function simulateAudio(t){
  let l,b,h;
  if(state==="speaking"){const syl=Math.pow(Math.abs(Math.sin(t*7.3)*Math.sin(t*2.1+1)),.8),gate=Math.sin(t*.9)>-.7?1:.15;l=(.3+.45*syl)*gate;b=l*(.6+.4*Math.sin(t*5));h=l*(.5+.5*Math.sin(t*11));}
  else if(state==="listening"){l=.2+.2*Math.abs(Math.sin(t*3.1)*Math.sin(t*1.3));b=l*.8;h=l*.5;}
  else if(state==="thinking"){l=.12+.07*Math.sin(t*2.2);b=l*.7;h=l*.6;}
  else{l=.05+.03*Math.sin(t*1.1);b=l;h=l*.5;}
  return [l,b,h];
}
function readAudio(t,dt){
  let l,b,h;
  if(performance.now() - externalAudioTime < 220){
    l = extAudio.level;
    b = extAudio.bass;
    h = extAudio.high;
  } else if(micOn&&analyser){
    analyser.getByteFrequencyData(freq);
    const avg=(a,z)=>{let s=0;for(let i=a;i<z;i++)s+=freq[i];return s/((z-a)*255);};
    l=Math.min(avg(0,freq.length)*2.6,1);b=Math.min(avg(0,6)*2.2,1);h=Math.min(avg(48,110)*3,1);
  } else {
    [l,b,h]=simulateAudio(t);
  }
  const k=1-Math.exp(-dt*(l>audio.level?18:6));
  audio.level+=(l-audio.level)*k;audio.bass+=(b-audio.bass)*k;audio.high+=(h-audio.high)*k;
}

let dragging=false,px=0,py=0,velX=0,velY=0;

  canvas.style.cursor="grabbing";
  const rect=canvas.getBoundingClientRect();
  if(rect.width>0&&rect.height>0){
    targetGazeX=Math.max(-1,Math.min(1,((e.clientX-rect.left)/rect.width)*2-1));
    targetGazeY=Math.max(-1,Math.min(1,((e.clientY-rect.top)/rect.height)*2-1));

const endDrag=(e)=>{
