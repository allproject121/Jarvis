/* Interactive Tap / Poke Touch Reactions & Event-driven Reactions */
function triggerReaction(type) {
  type = (type || "").toLowerCase();
  activeEmote = type;
  if (type === "wave") emoteTimer = 2.4;
  else if (type === "teach" || type === "learning") emoteTimer = 2.6;
  else if (type === "joy" || type === "laugh") emoteTimer = 2.4;
  else if (type === "success") emoteTimer = 2.4;
  else if (type === "failed") emoteTimer = 2.2;
  else if (type === "listening") emoteTimer = 2.0;
  else if (type === "thinking") emoteTimer = 2.5;
  else if (type === "curious") emoteTimer = 2.0;
  else if (type === "nod") emoteTimer = 1.8;
  else if (type === "blush") emoteTimer = 2.0;
  else emoteTimer = 2.0;

  console.log("TriggerReaction: type=" + type + " timer=" + emoteTimer + " entity=" + entityType);

  if (entityType === "custom_3d" || entityType === "ai_girl" || entityType === "hinata_anime") {
    customModelReactionTimer = 1.2;
    if (type === "wave") customModelReactionIndex = 3;
    else if (type === "success") customModelReactionIndex = 0;
    else if (type === "failed") customModelReactionIndex = 1;
    else customModelReactionIndex = 2;
  }
}

function triggerTouchReaction() {
  const reactionPool = ["wave", "nod", "curious", "blush", "success"];
  emoteCycle = (emoteCycle + 1) % reactionPool.length;
  triggerReaction(reactionPool[emoteCycle]);

  if (entityType === "custom_3d" || entityType === "ai_girl" || entityType === "hinata_anime") {
    if (customModelMixer && customModelMixer._actions && customModelMixer._actions.length > 0) {
      try {
        const action = customModelMixer._actions[0];
        action.timeScale = 1.8;
        setTimeout(() => { try { action.timeScale = 1.0; } catch(_) {} }, 1400);
      } catch (_) {}
    }
    try {
      if (window.JarvisBridge && typeof window.JarvisBridge.onOrbClicked === "function") {
        window.JarvisBridge.onOrbClicked();
      }
    } catch (_) {}
  } else if (entityType === "orb") {
    cur.wob = 1.5;
    setTimeout(() => { cur.wob = 0; }, 600);
  } else if (entityType === "arc_reactor") {
    audio.bass = Math.min(1, audio.bass + 0.8);
  }

  try {
    if (window.Jarvis3DModelBridge && window.Jarvis3DModelBridge.onModelTouchReact) {
      window.Jarvis3DModelBridge.onModelTouchReact();
    }
  } catch (_) {}
}

canvas.addEventListener("click", () => {
  triggerTouchReaction();
});

/* ---------- Entity & Granular Component Toggles ---------- */
let entityType = "orb"; // "orb" | "ai_girl" | "arc_reactor" | "custom_3d" | "hinata_anime"
let componentToggles = {
  core: true,
  glow: true,
  rings: true,
  ring1: true,
  ring2: true,
  ring3: true,
  orbitDust: true,
  shadow: true,
  idleBreathing: true,
  touchDrag: true,
  audioReactive: true,
  autoRotation: false // Default false: authentic anime forward orientation without spinning carousel
};

/* ---------- Update ---------- */
let time=0,flow=0,r1a=0,r2a=0,r3a=0,pxPerUnit=300;
let speedMultiplier=1.0, glowMultiplier=1.0, scaleMultiplier=1.0, resonanceMultiplier=1.0;

function updateOrb(dt){
  const k=1-Math.exp(-dt*3.5);
  for(const key in cur) cur[key]+=(tgt[key]-cur[key])*k;
  const effSpeed=cur.speed*speedMultiplier*resonanceMultiplier;
  time+=dt;flow+=dt*effSpeed;r1a+=dt*(.12+cur.ring*.6)*speedMultiplier;r2a-=dt*(.08+cur.ring*.35)*speedMultiplier;
  r3a+=dt*(.15+cur.ring*.55)*speedMultiplier;
  readAudio(time,dt);

  // Granular Toggles evaluation
  const cfg = componentToggles;
  shadowEl.style.display = cfg.shadow ? "block" : "none";
  if (!cfg.audioReactive) { audio.level = 0; audio.bass = 0; audio.high = 0; }

  const idlePulse = cfg.idleBreathing ? Math.pow(Math.max(0,Math.sin(time*.5)),12)*.15*(1-cur.wob) : 0;
  const s=cur.scale*scaleMultiplier*(1+.018*Math.sin(time*1.2)+audio.level*.07+cur.wob*.025*Math.sin(time*3.6));
  orb.scale.setScalar(s);

  // Controlled 3D Auto-Rotation
  const doAutoRotate = cfg.autoRotation === true;
  if (doAutoRotate) {
    orb.rotation.y += dt * .18 * (.5 + effSpeed) + velY * Math.min(dt * 20, 1) * .5;
  } else {
    orb.rotation.y += velY * Math.min(dt * 20, 1) * .5;
  }
  orb.rotation.x=Math.max(-1.2,Math.min(1.2,orb.rotation.x+velX*Math.min(dt*20,1)*.5));
  velX*=Math.exp(-dt*5);velY*=Math.exp(-dt*5);
  if(!dragging&&Math.abs(orb.rotation.x)>.001) orb.rotation.x*=Math.exp(-dt*.6);

  U.uTime.value=flow;U.uAmp.value=audio.level+cur.wob*.25;U.uBass.value=audio.bass;U.uHigh.value=audio.high;
  U.uCyan.value=cur.cyan;U.uPurple.value=cur.purple;U.uBright.value=(cur.bright*glowMultiplier)+idlePulse;
  glowMat.uniforms.uTime.value=time;glowMat.uniforms.uMix.value=cur.cyan;
  glowMat.uniforms.uStrength.value=(cur.glow*glowMultiplier)+audio.level*.6+idlePulse*2;
  const pulse=cur.ring*.5*(.5+.5*Math.sin(time*4))+audio.bass*.8;
  ring1.rotation.z=r1a;ring2.rotation.z=r2a;
  ring3.rotation.z=r3a;
  ring3.rotation.y=Math.sin(time*0.5)*0.2;
  ring1.scale.setScalar(s*(1+pulse*.03));ring2.scale.setScalar(s*(1+pulse*.02));
  ring3.scale.setScalar(s*(1+pulse*.035));
  ring1.material.uniforms.uAlpha.value=(.4+cur.ring*.3+audio.level*.35)*Math.min(glowMultiplier, 1.4);
  ring2.material.uniforms.uAlpha.value=(.22+cur.ring*.2+audio.level*.2)*Math.min(glowMultiplier, 1.4);
  ring3.material.uniforms.uAlpha.value=(.28+cur.ring*.25+audio.level*.25)*Math.min(glowMultiplier, 1.4);
  shadowEl.style.width=Math.round(pxPerUnit*1.5*s)+"px";

  // Entity Type Routing & Component Visibility
  const anyEnabled = (cfg.core !== false) || (cfg.glow !== false) || (cfg.rings !== false);
  const effCore = anyEnabled ? cfg.core : true;
  const effGlow = anyEnabled ? cfg.glow : true;
  const effRings = anyEnabled ? cfg.rings : true;
  const effRing1 = anyEnabled ? cfg.ring1 : true;
  const effRing2 = anyEnabled ? cfg.ring2 : true;
  const effRing3 = anyEnabled ? cfg.ring3 : true;
  const showRings = effRings;
  if (emoteTimer > 0) {
    emoteTimer -= dt;
    if (emoteTimer <= 0) {
      activeEmote = "none";
      emoteTimer = 0;
    }
  }

  if (entityType === "orb") {
    ring1.position.set(0, 0, 0);
    ring1.rotation.x = 0;
    ring1.rotation.y = 0;
    ring2.position.set(0, 0, 0);
    ring2.rotation.x = 0;
    ring2.rotation.y = 0;
    ring3.position.set(0, 0, 0);
    ring3.rotation.x = 1.05;

    pointsMesh.visible = effCore;
    glow.visible = effGlow;
    ring1.visible = showRings && effRing1;
    ring2.visible = showRings && effRing2;
    ring3.visible = showRings && effRing3;
    orbitPts.visible = cfg.orbitDust;
    if (aiGirlGroup) aiGirlGroup.visible = false;
    if (arcReactorGroup) arcReactorGroup.visible = false;
    if (customPhotoGroup) customPhotoGroup.visible = false;
    if (customModelGroup) customModelGroup.visible = false;
  } else if (entityType === "arc_reactor") {
    pointsMesh.visible = false;
    glow.visible = cfg.glow;
    ring1.visible = false;
    ring2.visible = false;
    ring3.visible = false;
    orbitPts.visible = cfg.orbitDust;
    if (aiGirlGroup) aiGirlGroup.visible = false;
    if (arcReactorGroup) {
      arcReactorGroup.visible = true;
      updateArcReactor(time, dt);
    }
    if (customPhotoGroup) customPhotoGroup.visible = false;
    if (customModelGroup) customModelGroup.visible = false;
  } else if (entityType === "custom_3d" || entityType === "ai_girl" || entityType === "hinata_anime") {
    if (aiGirlGroup) aiGirlGroup.visible = false;
    if (arcReactorGroup) arcReactorGroup.visible = false;
    const hasRealModel = customModelLoaded && customModelGroup && customModelInner;
    const hasPhoto = customPhotoLoaded && customPhotoGroup;

    if (hasRealModel) {
      pointsMesh.visible = false;

      // Holographic Ring Stand flat beneath feet
      ring1.position.set(0, -1.28, 0);
      ring1.rotation.x = Math.PI / 2;
      ring1.rotation.y = 0;
      ring1.visible = showRings && effRing1;

      ring2.position.set(0, -1.28, 0);
      ring2.rotation.x = Math.PI / 2;
      ring2.rotation.y = 0;
      ring2.visible = showRings && effRing2;

      ring3.position.set(0, 0, -0.25);
      ring3.rotation.x = 1.05;
      ring3.visible = showRings && effRing3;

      glow.visible = cfg.glow;
      orbitPts.visible = cfg.orbitDust;
      if (aiGirlGroup) aiGirlGroup.visible = false;
      if (arcReactorGroup) arcReactorGroup.visible = false;
      if (customPhotoGroup) customPhotoGroup.visible = false;
      customModelGroup.visible = true;

      // Update humanoid engine (handles animations, procedural bones, blinks & lip-sync)
      if (customModelEngine) {
        customModelEngine.update(dt, time, state, audio, gazeX, gazeY, activeEmote, emoteTimer);
      } else if (customModelMixer) {
        customModelMixer.update(dt);
      }

      // Stand firmly and straight on holographic pedestal - feet anchored at stand level
      customModelGroup.position.set(0, -1.28, 0);
      customModelGroup.rotation.x = 0;
      customModelGroup.rotation.z = 0;
      customModelGroup.scale.setScalar(scaleMultiplier);

      if (componentToggles.autoRotation) {
        customModelRotY += dt * 0.5 * speedMultiplier;
        customModelGroup.rotation.y = customModelRotY;
      } else {
        customModelGroup.rotation.y = THREE.MathUtils.lerp(customModelGroup.rotation.y, customModelRotY, dt * 6.0);
      }
    } else if (hasPhoto) {
      pointsMesh.visible = false;
      ring1.visible = false;
      ring2.visible = false;
      ring3.visible = showRings && cfg.ring3;
      glow.visible = cfg.glow;
      orbitPts.visible = cfg.orbitDust;
      if (aiGirlGroup) aiGirlGroup.visible = false;
      if (arcReactorGroup) arcReactorGroup.visible = false;
      if (customModelGroup) customModelGroup.visible = false;
      customPhotoGroup.visible = true;
      updateCustomPhotoMesh(time, dt);
    } else {
      // SAFE FALLBACK: If neither model nor photo is loaded yet, keep the plasma core and rings visible! Never leave canvas blank!
      pointsMesh.visible = cfg.core;
      glow.visible = cfg.glow;
      ring1.visible = showRings && cfg.ring1;
      ring2.visible = showRings && cfg.ring2;
      ring3.visible = showRings && cfg.ring3;
      orbitPts.visible = cfg.orbitDust;
      if (aiGirlGroup) aiGirlGroup.visible = false;
      if (arcReactorGroup) arcReactorGroup.visible = false;
      if (customModelGroup) customModelGroup.visible = false;
      if (customPhotoGroup) customPhotoGroup.visible = false;
    }
  }
}

function updateParticles(dt){
  const P=orbitPts.geometry.attributes,boost=(.6+cur.speed*.8+(state==="thinking"?1.2:0))*resonanceMultiplier;
  for(let i=0;i<ORBIT;i++){
    const d=ptData[i];d.a+=d.sp*dt*boost;
    const r=d.r+Math.sin(time*d.fs+d.ph)*.12-(state==="thinking"?.15:0)+audio.level*.1;
    const x=Math.cos(d.a)*r,z=Math.sin(d.a)*r*.6,y=d.y*.8+Math.sin(d.a*1.3+d.ph)*.18+x*d.tilt*.25;
    P.position.setXYZ(i,x,y,z);
    P.aAlpha.setX(i,Math.pow(.5+.5*Math.sin(time*d.fs*1.6+d.ph),1.5)*(.55+cur.glow*.3));
  }
  P.position.needsUpdate=true;P.aAlpha.needsUpdate=true;
}

/* ---------- Resize / loop ---------- */
function handleResize(){
  if (!renderer) return;
  const w = Math.max(stage ? stage.clientWidth : 0, window.innerWidth || 300, 100);
  const h = Math.max(stage ? stage.clientHeight : 0, window.innerHeight || 300, 100);
  const pr = Math.min(window.devicePixelRatio || 1, 2);
  renderer.setPixelRatio(pr);
  renderer.setSize(w, h, true);
  camera.aspect = w / h;
  const visH = VIS / Math.min(1, w / h);
  const tan = Math.tan(THREE.MathUtils.degToRad(FOV / 2));
  camera.position.z = visH / (2 * tan);
  U.uCamZ.value = camera.position.z;
  camera.updateProjectionMatrix();
  pxPerUnit = h / visH;
  U.uPx.value = h * pr / (2 * tan);
  if (shadowEl) shadowEl.style.top = Math.round(h / 2 + pxPerUnit * 1.2) + "px";
}

let last = performance.now();
let lastStageW = 0, lastStageH = 0;
function animate(now){
  requestAnimationFrame(animate);
  const curW = stage ? stage.clientWidth : 0;
  const curH = stage ? stage.clientHeight : 0;
  if ((curW > 10 && curH > 10) && (Math.abs(curW - lastStageW) > 2 || Math.abs(curH - lastStageH) > 2)) {
    lastStageW = curW;
    lastStageH = curH;
    handleResize();
  }
  const dt = Math.max(0.001, Math.min((now - last) / 1000, 0.05));
  last = now;
  updateOrb(dt);
  updateParticles(dt);
  updateCompanionFleet(time, dt);
  if (renderer) renderer.render(scene, camera);
}

document.querySelectorAll("[data-s]").forEach(b=>b.addEventListener("click",()=>setOrbState(b.dataset.s)));
document.querySelectorAll("[data-t]").forEach(b=>b.addEventListener("click",()=>applyTheme(b.dataset.t)));
const bgcInput = $("#bgc");
if(bgcInput) bgcInput.addEventListener("input",e=>applyTheme(null,e.target.value));
const micBtn = $("#mic");
if(micBtn) micBtn.addEventListener("click",()=>micOn?stopAudioReactive():startAudioReactive());
window.addEventListener("resize",handleResize);
window.addEventListener("orientationchange",()=>setTimeout(handleResize,200));
if(window.ResizeObserver && stage) new ResizeObserver(handleResize).observe(stage);

window.JarvisOrb={
  resize: handleResize,
  setState:setOrbState,
  setTheme:(n,custom)=>{
    applyTheme(n,custom);
  },
  setPreset:(p,custom)=>{
    applyTheme(p,custom);
  },
  setSpeed:sp=>{ speedMultiplier=Math.max(0.1,Math.min(3.0,Number(sp)||1.0)); },
  setGlow:gl=>{ glowMultiplier=Math.max(0.1,Math.min(3.0,Number(gl)||1.0)); },
  setScale:sc=>{ scaleMultiplier=Math.max(0.4,Math.min(2.5,Number(sc)||1.0)); },
  setResonance:res=>{ resonanceMultiplier=Math.max(0.2,Math.min(2.0,(Number(res)||84)/84.0)); },
  setBackground:hex=>{
    if(!isEmbedded) document.documentElement.style.setProperty("--bg",hex);
    applyTheme(null,hex);
  },
  setEntityType:type=>{
    entityType = type || "orb";
    if (entityType === "arc_reactor") {
      if (pointsMesh) pointsMesh.visible = false;
      if (glow) glow.visible = false;
      if (ring1) ring1.visible = false;
      if (ring2) ring2.visible = false;
      if (ring3) ring3.visible = false;
      if (aiGirlGroup) aiGirlGroup.visible = false;
      if (customPhotoGroup) customPhotoGroup.visible = false;
      if (customModelGroup) customModelGroup.visible = false;
      if (arcReactorGroup) arcReactorGroup.visible = true;
    } else if (entityType === "ai_girl" || entityType === "custom_3d" || entityType === "hinata_anime") {
      if (arcReactorGroup) arcReactorGroup.visible = false;
      if (aiGirlGroup) aiGirlGroup.visible = false;
      if (pointsMesh) pointsMesh.visible = false;
      if (ring1) ring1.visible = false;
      if (ring2) ring2.visible = false;
      if (ring3) ring3.visible = true;
      if (glow) glow.visible = true;
      if (customModelGroup) customModelGroup.visible = true;
      if (customPhotoGroup) customPhotoGroup.visible = !customModelLoaded;
      if (!customModelLoaded) {
        loadCustom3DModelStream();
      }
    } else {
      entityType = "orb";
      clearCustom3DModel();
      if (arcReactorGroup) arcReactorGroup.visible = false;
      if (aiGirlGroup) aiGirlGroup.visible = false;
      if (customPhotoGroup) customPhotoGroup.visible = false;
      if (customModelGroup) customModelGroup.visible = false;
      if (pointsMesh) pointsMesh.visible = componentToggles.core;
      if (glow) glow.visible = componentToggles.glow;
      if (ring1) ring1.visible = componentToggles.rings && componentToggles.ring1;
      if (ring2) ring2.visible = componentToggles.rings && componentToggles.ring2;
      if (ring3) ring3.visible = componentToggles.rings && componentToggles.ring3;
      if (orbitPts) orbitPts.visible = componentToggles.orbitDust;
    }
  },
  switchToDefaultOrb:()=>{
    entityType = "orb";
    clearCustom3DModel();
    if (arcReactorGroup) arcReactorGroup.visible = false;
    if (aiGirlGroup) aiGirlGroup.visible = false;
    if (customPhotoGroup) customPhotoGroup.visible = false;
    if (customModelGroup) customModelGroup.visible = false;
    if (pointsMesh) pointsMesh.visible = componentToggles.core;
    if (glow) glow.visible = componentToggles.glow;
    if (ring1) ring1.visible = componentToggles.rings && componentToggles.ring1;
    if (ring2) ring2.visible = componentToggles.rings && componentToggles.ring2;
    if (ring3) ring3.visible = componentToggles.rings && componentToggles.ring3;
    if (orbitPts) orbitPts.visible = componentToggles.orbitDust;
  },
  setAutoRotation:enabled=>{
    componentToggles.autoRotation = !!enabled;
  },
  setCompanionFleet:(count,style)=>{
    setCompanionFleet(count,style);
  },
  setCustomPhotoTexture:base64=>{
    applyCustomPhotoTexture(base64);
  },
  loadCustomPhoto:()=>{
    loadCustomPhotoFromBridge();
  },
  loadCustom3DModel:()=>{
    loadCustom3DModelFromBridge();
  },
  clearCustom3DModel:()=>{
    clearCustom3DModel();
  },
  parse3DModelBase64:(b64,format)=>{
    try {
      const bin = atob(b64);
      const bytes = new Uint8Array(bin.length);
      for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
      parseAndDisplay3DModel(bytes.buffer, format);
    } catch (e) {
      console.error("Base64 3D parse error", e);
    }
  },
  setComponentToggles:toggles=>{
    try{
      const obj = typeof toggles==="string"?JSON.parse(toggles):toggles;
      Object.assign(componentToggles, obj);
    }catch(_){}
  },
  triggerReaction: triggerReaction,
  triggerTouchReaction: triggerTouchReaction,
  triggerWave: () => triggerReaction("wave"),
  setRotY: (y) => {
    customModelRotY = Number(y) || 0;
    if (customModelGroup) customModelGroup.rotation.y = customModelRotY;
  },
  getEngine: () => customModelEngine,
  getInner: () => customModelInner,
  getGroup: () => customModelGroup,
  setEmote: (emote) => triggerReaction(emote),
  setAnimState: (s) => {
    setOrbState(s);
    if (customModelEngine) customModelEngine.fadeToAction(s === "speaking" ? "talking_0" : s, 0.35);
  },
  setExternalAudio:setExternalAudio,
  startListening:()=>setOrbState("listening"),
  startThinking:()=>setOrbState("thinking"),
  startSpeaking:()=>setOrbState("speaking"),
  stopSpeaking:()=>setOrbState("idle"),
  interrupt: () => {
    setOrbState("listening");
    if (customModelEngine && typeof customModelEngine.interrupt === "function") {
      customModelEngine.interrupt();
    }
  },
  startAudioReactive:startAudioReactive,
  stopAudioReactive:stopAudioReactive
};

handleResize();
applyTheme("dark");
setOrbState("idle");
requestAnimationFrame(animate);

// Layout stabilization checks for Android WebView
setTimeout(handleResize, 50);
setTimeout(handleResize, 150);
setTimeout(handleResize, 350);
setTimeout(handleResize, 800);
setTimeout(handleResize, 1500);

setTimeout(function() {
  try {
    if (entityType === "custom_3d" || entityType === "ai_girl" || entityType === "hinata_anime") {
      loadCustom3DModelFromBridge();
      loadCustomPhotoFromBridge();
    }
  } catch (e) {
    console.warn("Deferred bridge init error:", e);
  }
}, 300);
})();
