      // Activity on top) getDelta() returns seconds, which skipped whole reactions in one frame
      // and blew up every dt-scaled blend (morphs, gaze, crossfades).
      const dt = Math.min(clock.getDelta(), 0.1);
      const time = clock.getElapsedTime();

      // Audio pushes stop abruptly when playback ends; decay instead of holding the last value
      if (performance.now() - extAudioTime > 250) extAudioLevel *= Math.max(0, 1 - dt * 8);

      // Cyber pedestal neon ring counter-rotations
      ringMagenta.rotation.z = time * 0.22;
      ringCyan.rotation.z = -time * 0.16;

      // Floating cyber particles
      particles.rotation.y = time * 0.04;

      if (reactionTimer > 0) {
        reactionTimer -= dt;
        if (reactionTimer <= 0) {
          activeReaction = "none";
          reactionTimer = 0;
        }
      }

      // Look at the person in front of the phone (front camera face position from Android)
      if (moraController && !dragging) {
        const seen = viewer.present && (performance.now() - viewer.at) < 1500;
        const gx = seen ? viewer.x * 0.9 : 0, gy = seen ? viewer.y * 0.6 : 0;
        moraController.gazeX += (gx - moraController.gazeX) * Math.min(1, dt * 4);
        moraController.gazeY += (gy - moraController.gazeY) * Math.min(1, dt * 4);
      }

      if (moraController) {
        // While the on-device voice speaks her line, open/close the mouth with a speech-like rhythm
        const localTalk = performance.now() < localTalkUntil && (currentState === "idle" || currentState === "listening");
        const st = localTalk ? "speaking" : currentState;
        const amp = localTalk ? 0.25 + 0.6 * Math.abs(Math.sin(time * 11.0) * Math.sin(time * 3.3 + 0.7)) : extAudioLevel;
        moraController.update(dt, time, st, amp, activeReaction, reactionTimer);
        groundMora(dt);
      }

      if (bubbleUntil) {
        if (performance.now() > bubbleUntil) { bubbleUntil = 0; setBubbleVisible(false); }
        else placeBubble();
      }

      // Turn away / step back after unwanted touches, then come back once the mood ends
      if (moraPivot) {
        const moodOn = touchMood && time < touchMood.until;
        if (!moodOn) { turnTarget = 0; backTarget = 0; }
        if (!dragging) manualYaw += (0 - manualYaw) * Math.min(1, dt * 1.8);
        const tY = Math.PI + turnTarget + manualYaw;
        moraPivot.rotation.y += (tY - moraPivot.rotation.y) * Math.min(1, dt * (moodOn ? 6 : 2.2));
        moraPivot.position.z += (-backTarget - moraPivot.position.z) * Math.min(1, dt * (moodOn ? 7 : 2.5));
      }

      renderer.render(scene, camera);
    }
    animate();

    function handleResize() {
      updateCameraFraming();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
    window.addEventListener("resize", handleResize);

    /* =========================================================================
       Expose Universal Bridges: MoraCompanion AND JarvisOrb
       Full compatibility with both standalone character screen and HomeFragment
       ========================================================================= */
    const bridge = {
      setState: setMoraState,
      setExternalAudio: (amp, bass, high) => {
        extAudioLevel = Math.max(0, Math.min(1, Number(amp) || 0));
        extAudioTime = performance.now();
      },
      triggerReaction: triggerMoraReaction,
      triggerTouchReaction: onTouchPoke,
      forgive: forgive,
      isSulking: () => grudgeActive() || !!(touchMood && touchMood.type === "sulk"),
      setViewer: setViewer,
      getBond: () => Math.round(bond),
      greet: () => { try { localStorage.removeItem("mora_greet_v1"); } catch (_) {} greetForDayPart(); },
      resize: handleResize,
      interrupt: () => {
        setMoraState("listening");
        if (moraController) moraController.interrupt();
      },
      getController: () => moraController,
      getModel: () => moraModel,
      setEntityType: (entity) => console.log("Mora bridge setEntityType:", entity),
      setComponentToggles: () => {},
      setAutoRotation: () => {},
      setCompanionFleet: () => {},
      setSpeed: () => {},
      setGlow: () => {},
      setScale: () => {},
      setTheme: (theme, custom) => applyMoraTheme(theme, custom),
      setPreset: (preset, custom) => applyMoraTheme(preset, custom),
      setResonance: () => {},
      loadCustom3DModel: () => {},
      loadCustomPhoto: () => {},
      switchToDefaultOrb: () => {}
    };

    window.MoraCompanion = bridge;
    window.JarvisOrb = bridge;

    try {
        const urlParams = new URLSearchParams(window.location.search);
        const initTheme = urlParams.get("theme") || "dark";
        const initHex = urlParams.get("hex") || "";
        applyMoraTheme(initTheme, initHex);
      } catch (e) {
        console.warn("Error reading theme query params:", e);
      }
      console.log("Mora Companion & JarvisOrb Bridges initialized.");
  })();
  </script>
</body>
