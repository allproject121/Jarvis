<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mora — REDMAGIC Cyber AI Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #stage {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      touch-action: none;
    }
    canvas {
      display: block; width: 100%; height: 100%; outline: none;
    }
    .hud-badge {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(255, 0, 85, 0.4);
      padding: 5px 12px; border-radius: 20px; color: #fff; font-size: 10px;
      letter-spacing: 1px; text-transform: uppercase; display: flex; align-items: center; gap: 8px;
      backdrop-filter: blur(8px); pointer-events: none; transition: all 0.3s ease;
      opacity: 0.85;
    }
    .hud-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #FF0055;
      box-shadow: 0 0 8px #FF0055;
    }
  </style>
  <script src="three.min.js"></script>
  <script src="GLTFLoader.js"></script>
  <script src="mora_clips.js"></script>
</head>
<body>
  <div id="stage">
    <canvas id="c"></canvas>
    <div class="hud-badge" id="hudBadge">
      <span class="hud-dot" id="hudDot"></span>
      <span id="hudState">MORA • READY</span>
    </div>
  </div>

  <script>
  (function() {
    "use strict";

    /* =========================================================================
       Mora 3D Scene & WebGL Setup
       ========================================================================= */
    const canvas = document.getElementById("c");
    const stage = document.getElementById("stage");
    const hudState = document.getElementById("hudState");
    const hudDot = document.getElementById("hudDot");

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);

    // Initial camera placement: frame Mora and the 3D ground pedestal
    function updateCameraFraming() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const aspect = w / h;
      camera.aspect = aspect;
      if (aspect < 0.65) {
        // Tall portrait full screen (smartphones) - complete head-to-pedestal framing
        camera.position.set(0, 0.82, 2.72);
        camera.lookAt(0, 0.68, 0);
      } else if (aspect < 1.0) {
        camera.position.set(0, 0.86, 2.45);
        camera.lookAt(0, 0.68, 0);
      } else {
        // Landscape or compact card preview
        camera.position.set(0, 0.86, 2.30);
        camera.lookAt(0, 0.68, 0);
      }
      camera.updateProjectionMatrix();
    }
    updateCameraFraming();

    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      alpha: true,
      antialias: true,
      powerPreference: "high-performance"
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2.0));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.18;

    // REDMAGIC Cyberpunk Studio Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.90);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
    keyLight.position.set(1.5, 3.2, 2.5);
    scene.add(keyLight);

    const cyberMagentaRim = new THREE.PointLight(0xff0055, 2.0, 9);
    cyberMagentaRim.position.set(-2.0, 2.0, -1.5);
    scene.add(cyberMagentaRim);

    const electricCyanRim = new THREE.PointLight(0x00f0ff, 1.6, 9);
    electricCyanRim.position.set(2.0, 1.6, -1.0);
    scene.add(electricCyanRim);

    // REDMAGIC pedestal under-glow (lights the metallic deck from just above the neon rings)
    const pedestalGlow = new THREE.PointLight(0xff0055, 1.4, 2.2);
    pedestalGlow.position.set(0, 0.18, 0.35);
    scene.add(pedestalGlow);

    /* -------------------------------------------------------------------------
       REDMAGIC Character Rim Lighting
       mora.glb ships VRM/KHR_materials_unlit materials (MeshBasicMaterial), so
       scene lights never touch her body - the magenta/cyan point lights above
       only affect the pedestal. We inject a view-space fresnel rim term into
       her unlit materials so the theme colour actually wraps her silhouette.
       Uniforms are shared by every material -> one theme update recolours all.
       ------------------------------------------------------------------------- */
    const moraRimUniforms = {
      uMoraRimColorA: { value: new THREE.Color(0xff0055).convertSRGBToLinear() }, // left side (primary)
      uMoraRimColorB: { value: new THREE.Color(0xff2d2d).convertSRGBToLinear() }, // right side (secondary)
      uMoraRimStrength: { value: 0.55 },
      uMoraRimPower: { value: 2.6 },
      uMoraTint: { value: new THREE.Color(1, 1, 1) }
    };

    function applyMoraRimLighting(root) {
      const processed = new Set();
      root.traverse(function(node) {
        if (!node.isMesh || !node.material) return;
        const mats = Array.isArray(node.material) ? node.material : [node.material];
        for (const mat of mats) {
          if (processed.has(mat) || !mat.isMeshBasicMaterial) continue;
          processed.add(mat);
          mat.customProgramCacheKey = function() { return "mora_redmagic_rim_v1"; };
          mat.onBeforeCompile = function(shader) {
            Object.assign(shader.uniforms, moraRimUniforms);
            shader.vertexShader = shader.vertexShader
              .replace("#include <common>", "#include <common>\nvarying vec3 vMoraRimN;\nvarying vec3 vMoraRimV;")
              .replace("#include <fog_vertex>", [
                "#include <fog_vertex>",
                "vec3 moraN = normal;",
                "#ifdef USE_SKINNING",
                "  mat4 moraSkin = skinWeight.x * boneMatX + skinWeight.y * boneMatY + skinWeight.z * boneMatZ + skinWeight.w * boneMatW;",
                "  moraN = ( bindMatrixInverse * moraSkin * bindMatrix * vec4( moraN, 0.0 ) ).xyz;",
                "#endif",
                "vMoraRimN = normalize( normalMatrix * moraN );",
                "vMoraRimV = normalize( -mvPosition.xyz );"
              ].join("\n"));
            shader.fragmentShader = shader.fragmentShader
              .replace("#include <common>", [
                "#include <common>",
                "varying vec3 vMoraRimN;",
                "varying vec3 vMoraRimV;",
                "uniform vec3 uMoraRimColorA;",
                "uniform vec3 uMoraRimColorB;",
                "uniform float uMoraRimStrength;",
                "uniform float uMoraRimPower;",
                "uniform vec3 uMoraTint;"
              ].join("\n"))
              .replace("#include <envmap_fragment>", [
                "#include <envmap_fragment>",
                "float moraFacing = clamp( abs( dot( normalize( vMoraRimN ), normalize( vMoraRimV ) ) ), 0.0, 1.0 );",
                "float moraRim = pow( 1.0 - moraFacing, uMoraRimPower );",
                "vec3 moraRimCol = mix( uMoraRimColorB, uMoraRimColorA, smoothstep( -0.45, 0.45, -vMoraRimN.x ) );",
                "outgoingLight = outgoingLight * uMoraTint + moraRimCol * moraRim * uMoraRimStrength;"
              ].join("\n"));
          };
          mat.needsUpdate = true;
        }
      });
    }

    /* =========================================================================
       REDMAGIC 3D Cyber Ground Pedestal / Architectural Standing Dock
       Solid physical command platform anchoring Mora firmly to the ground.
       ========================================================================= */
    const stageGroup = new THREE.Group();
    scene.add(stageGroup);

    const stageRadius = 0.65;

    // 1. Solid Top Metallic Deck Plate (Top surface flush at Y = 0)
    const topDeckGeo = new THREE.CylinderGeometry(stageRadius, stageRadius * 1.02, 0.04, 48);
    const deckMat = new THREE.MeshStandardMaterial({
      color: 0x090e1a,
      roughness: 0.28,
      metalness: 0.85
    });
    const topDeckMesh = new THREE.Mesh(topDeckGeo, deckMat);
    topDeckMesh.position.y = -0.02;
    topDeckMesh.receiveShadow = true;
    stageGroup.add(topDeckMesh);

    // 2. Heavy Architectural Sub-Base (Extends deeply downwards to Y = -0.22)
    const subBaseGeo = new THREE.CylinderGeometry(stageRadius * 1.02, stageRadius * 1.16, 0.20, 48);
    const subBaseMat = new THREE.MeshStandardMaterial({
      color: 0x04060c,
      roughness: 0.42,
      metalness: 0.92
    });
    const subBaseMesh = new THREE.Mesh(subBaseGeo, subBaseMat);
    subBaseMesh.position.y = -0.14;
    stageGroup.add(subBaseMesh);

    // 3. Foundation Floor Anchor Plinth (Anchors firmly to Y = -0.36)
    const plinthGeo = new THREE.CylinderGeometry(stageRadius * 1.16, stageRadius * 1.25, 0.16, 48);
    const plinthMat = new THREE.MeshStandardMaterial({
      color: 0x020306,
      roughness: 0.55,
      metalness: 0.96
    });
    const plinthMesh = new THREE.Mesh(plinthGeo, plinthMat);
    plinthMesh.position.y = -0.32;
    stageGroup.add(plinthMesh);

    // 4. Beveled Outer Glow Rim (LED Edge)
    const rimGeo = new THREE.TorusGeometry(stageRadius, 0.008, 16, 64);
    const rimMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
    const rimMesh = new THREE.Mesh(rimGeo, rimMat);
    rimMesh.rotation.x = Math.PI / 2;
    rimMesh.position.y = 0.001;
    stageGroup.add(rimMesh);

    // 5. Anti-Slip Foot Placement Dock Pads (Underneath Mora's left & right platform shoes)
    const padGeo = new THREE.PlaneGeometry(0.12, 0.24);
    const padMat = new THREE.MeshStandardMaterial({
      color: 0x0f172a,
      roughness: 0.45,
      metalness: 0.75,
      side: THREE.DoubleSide
    });

    const padAccentMat = new THREE.MeshBasicMaterial({
      color: 0x00f0ff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.65
    });

    const leftPad = new THREE.Mesh(padGeo, padMat);
    leftPad.rotation.x = -Math.PI / 2;
    leftPad.rotation.z = 0.035;
    leftPad.position.set(-0.105, 0.0012, 0.015);
    stageGroup.add(leftPad);

    const rightPad = new THREE.Mesh(padGeo, padMat);
    rightPad.rotation.x = -Math.PI / 2;
    rightPad.rotation.z = -0.035;
    rightPad.position.set(0.105, 0.0012, 0.015);
    stageGroup.add(rightPad);
    // The fixed pads never matched where her feet actually are (they read as dark squares
    // next to the shoes), so they stay hidden; the soft foot shadows below follow the feet.
    leftPad.visible = false; rightPad.visible = false;

    // 6. Dedicated Dual Contact Ambient Occlusion Shadows (Direct contact under each shoe sole)
    const footShadowCanvas = document.createElement("canvas");
    footShadowCanvas.width = 128;
    footShadowCanvas.height = 256;
    const fsCtx = footShadowCanvas.getContext("2d");
    const fsGrad = fsCtx.createRadialGradient(64, 128, 6, 64, 128, 58);
    fsGrad.addColorStop(0, "rgba(0, 0, 0, 0.95)");
    fsGrad.addColorStop(0.35, "rgba(0, 0, 0, 0.75)");
    fsGrad.addColorStop(0.75, "rgba(0, 0, 0, 0.30)");
    fsGrad.addColorStop(1, "rgba(0, 0, 0, 0.0)");
    fsCtx.fillStyle = fsGrad;
    fsCtx.fillRect(0, 0, 128, 256);
    const footShadowTex = new THREE.CanvasTexture(footShadowCanvas);

    const footShadowGeo = new THREE.PlaneGeometry(0.13, 0.26);
    const footShadowMat = new THREE.MeshBasicMaterial({
      map: footShadowTex,
      transparent: true,
      opacity: 0.95,
      depthWrite: false
    });

    const leftFootShadow = new THREE.Mesh(footShadowGeo, footShadowMat);
    leftFootShadow.rotation.x = -Math.PI / 2;
    leftFootShadow.rotation.z = 0.035;
    leftFootShadow.position.set(-0.105, 0.002, 0.015);
    stageGroup.add(leftFootShadow);

    const rightFootShadow = new THREE.Mesh(footShadowGeo, footShadowMat.clone());
    rightFootShadow.rotation.x = -Math.PI / 2;
    rightFootShadow.rotation.z = -0.035;
    rightFootShadow.position.set(0.105, 0.002, 0.015);
    stageGroup.add(rightFootShadow);

    // 7. Broad Ambient Body Shadow Disc
    const shadowCanvas = document.createElement("canvas");
    shadowCanvas.width = 128;
    shadowCanvas.height = 128;
    const sCtx = shadowCanvas.getContext("2d");
    const grad = sCtx.createRadialGradient(64, 64, 4, 64, 64, 62);
    grad.addColorStop(0, "rgba(0, 0, 0, 0.85)");
    grad.addColorStop(0.45, "rgba(0, 0, 0, 0.45)");
    grad.addColorStop(1, "rgba(0, 0, 0, 0.0)");
    sCtx.fillStyle = grad;
    sCtx.fillRect(0, 0, 128, 128);
    const shadowTex = new THREE.CanvasTexture(shadowCanvas);
    const shadowGeo = new THREE.PlaneGeometry(0.70, 0.70);
    const shadowMat = new THREE.MeshBasicMaterial({
      map: shadowTex,
      transparent: true,
      depthWrite: false
    });
    const contactShadow = new THREE.Mesh(shadowGeo, shadowMat);
    contactShadow.rotation.x = -Math.PI / 2;
    contactShadow.position.y = 0.0018;
    stageGroup.add(contactShadow);

    // 8. Concentric Neon Counter-Rotating Pulse Rings
    const ringMagentaGeo = new THREE.RingGeometry(0.36, 0.38, 48);
    const ringMagentaMat = new THREE.MeshBasicMaterial({
      color: 0xff0055,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.85
    });
    const ringMagenta = new THREE.Mesh(ringMagentaGeo, ringMagentaMat);
    ringMagenta.rotation.x = -Math.PI / 2;
    ringMagenta.position.y = 0.0025;
    stageGroup.add(ringMagenta);

    const ringCyanGeo = new THREE.RingGeometry(0.50, 0.518, 48);
    const ringCyanMat = new THREE.MeshBasicMaterial({
      color: 0x00f0ff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.75
    });
    const ringCyan = new THREE.Mesh(ringCyanGeo, ringCyanMat);
    ringCyan.rotation.x = -Math.PI / 2;
    ringCyan.position.y = 0.0025;
    stageGroup.add(ringCyan);

    // 9. Holographic Radial Ticks around pedestal rim
    const tickMaterials = [];
    for (let i = 0; i < 12; i++) {
      const angle = (i / 12) * Math.PI * 2;
      const tickGeo = new THREE.PlaneGeometry(0.012, 0.042);
      const tickMat = new THREE.MeshBasicMaterial({
        color: (i % 3 === 0) ? 0x00f0ff : 0xff0055,
        side: THREE.DoubleSide,
        transparent: true,
        opacity: 0.75
      });
      tickMaterials.push(tickMat);
      const tickMesh = new THREE.Mesh(tickGeo, tickMat);
      tickMesh.rotation.x = -Math.PI / 2;
      tickMesh.rotation.z = angle;
      tickMesh.position.set(Math.cos(angle) * 0.44, 0.0028, Math.sin(angle) * 0.44);
      stageGroup.add(tickMesh);
    }

    // 6. Floating Cyber Energy Particles
    const particleCount = 40;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      pPos[i] = (Math.random() - 0.5) * 1.8;
      pPos[i + 1] = Math.random() * 1.8;
      pPos[i + 2] = (Math.random() - 0.5) * 1.8;
    }
    pGeo.setAttribute("position", new THREE.BufferAttribute(pPos, 3));
    const pMat = new THREE.PointsMaterial({
      color: 0xff0055,
      size: 0.022,
      transparent: true,
      opacity: 0.65
    });
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    
    function applyMoraTheme(themeKey, customHex) {
      const key = (themeKey || "").toLowerCase().trim();
      // REDMAGIC signature palette (magenta + red). Used for every app skin that
      // has no accent colour of its own (dark, amoled, androllm_night, ...), so
      // Mora keeps her red/magenta identity instead of inheriting a violet/white skin.
      let primary = 0xff0055;   // REDMAGIC magenta
      let secondary = 0xff2d2d; // REDMAGIC red
      let particle = 0xff0055;

      // A custom hex only applies when the user actually chose a custom colour
      // (theme key "custom" or the hex itself). Previously any stale customHex
      // overrode the palette and turned the secondary accents white.
      const hexSource = key.startsWith("#") ? key : ((key === "custom" || key === "") ? (customHex || "") : "");
      if (hexSource && typeof hexSource === "string" && hexSource.startsWith("#")) {
        try {
          const c = new THREE.Color(hexSource);
          primary = c.getHex();
          secondary = c.clone().offsetHSL(0.04, 0, 0.12).getHex();
          particle = c.getHex();
        } catch (_){}
      }

      if (key === "red" || key === "crimson" || key === "ruby") {
        primary = 0xff1744;   // Vibrant Electric Red
        secondary = 0xff5252; // Neon Coral Red
        particle = 0xff1744;  // Red sparks
      } else if (key === "pearl_white" || key === "white" || key === "light") {
        primary = 0xffffff;   // Clean Pearl White
        secondary = 0x38bdf8; // Radiant Ice Blue
        particle = 0xffffff;  // White cosmic dust
      } else if (key === "emerald" || key === "green" || key === "lime") {
        primary = 0x10b981;
        secondary = 0x34d399;
        particle = 0x10b981;
      } else if (key === "gold" || key === "amber") {
        primary = 0xf59e0b;
        secondary = 0xfbbf24;
        particle = 0xf59e0b;
      } else if (key === "amethyst" || key === "purple" || key === "violet") {
        primary = 0xc084fc;
        secondary = 0xa855f7;
        particle = 0xc084fc;
      } else if (key === "pink" || key === "rose") {
        primary = 0xec4899;
        secondary = 0xf472b6;
        particle = 0xec4899;
      } else if (key === "sunset") {
        primary = 0xff6a3d;
        secondary = 0xfb7185;
        particle = 0xff6a3d;
      } else if (key === "androllm_parchment") {
        primary = 0xd97757;   // AndroLLM terracotta
        secondary = 0xb3573e;
        particle = 0xe69d81;
      } else if (key === "stealth") {
        primary = 0x38bdf8;
        secondary = 0x64748b;
        particle = 0x38bdf8;
      }

      if (rimMat) rimMat.color.setHex(secondary);
      if (padAccentMat) padAccentMat.color.setHex(secondary);
      if (ringMagentaMat) ringMagentaMat.color.setHex(primary);
      if (ringCyanMat) ringCyanMat.color.setHex(secondary);
      if (pMat) pMat.color.setHex(particle);
      tickMaterials.forEach((tm, idx) => {
        if (tm && tm.color) tm.color.setHex(idx % 2 === 0 ? primary : secondary);
      });
      // Scene lighting + character rim follow the theme too (previously only the
      // pedestal meshes were recoloured, the lights stayed hard-coded magenta/cyan).
      cyberMagentaRim.color.setHex(primary);
      electricCyanRim.color.setHex(secondary);
      pedestalGlow.color.setHex(primary);
      moraRimUniforms.uMoraRimColorA.value.setHex(primary).convertSRGBToLinear();
      moraRimUniforms.uMoraRimColorB.value.setHex(secondary).convertSRGBToLinear();
      const hudBadge = document.getElementById("hudBadge");
      const primaryCss = "#" + new THREE.Color(primary).getHexString();
      if (hudBadge) hudBadge.style.borderColor = primaryCss + "99";
      moraIdleDotColor = primaryCss;
      if (hudDot && currentState === "idle") { hudDot.style.background = primaryCss; hudDot.style.boxShadow = "0 0 8px " + primaryCss; }
      console.log("Mora theme applied:", key, customHex);
    }

    /* =========================================================================
       MoraCharacterController & Expression / Lip-Sync System
       ========================================================================= */
    const AXIS_X = new THREE.Vector3(1, 0, 0);
    const AXIS_Y = new THREE.Vector3(0, 1, 0);
    const AXIS_Z = new THREE.Vector3(0, 0, 1);
    const _qp = new URLSearchParams(window.location.search);
    // Elbow bend for the idle layer; ?elbow=<signed radians> overrides it when tuning.
    const ELBOW_BEND = _qp.has("elbow") ? Math.abs(parseFloat(_qp.get("elbow"))) : 0.32;
    const ELBOW_SIGN_L = _qp.has("elbow") ? (parseFloat(_qp.get("elbow")) < 0 ? -1 : 1) : -1; // -1 = forearms bend forward (tested)
    const ELBOW_SIGN_R = -ELBOW_SIGN_L;

    class MoraCharacterController {
      constructor(rootModel) {
        this.root = rootModel;
        this.bones = {};
        this.restRotations = {};
        this.morphMeshes = [];
        this.morphMap = {
          mthA: [],
          mthO: [],
          mthI: [],
          mthE: [],
          mthSmall: [],
          mthJoy: [],
          mthSurprised: [],
          eyeBlink: [],
          eyeWinkR: [],
          eyeWinkL: [],
          eyeJoy: [],
          eyeSurprised: [],
          brwJoy: [],
          brwFun: [],
          brwSurprised: [],
          allJoy: [],
          allSurprised: [],
          allFun: [],
          allAngry: [],
          brwAngry: [],
          eyeAngry: [],
          mthAngry: [],
          allSorrow: [],
          mthSorrow: []
        };
        this.mixer = new THREE.AnimationMixer(this.root);
        this.actions = {};
        this.activeAction = null;
        this.activeActionName = "idle";
        this.hasClips = false;
        this.hasMorphs = false;

        // Kinematic tracking
        this.headYaw = 0;
        this.headPitch = 0;
        this.headRoll = 0;
        this.gazeX = 0;
        this.gazeY = 0;
        this.curGazeX = 0;
        this.curGazeY = 0;

        this.init();
      }

      init() {
        const self = this;
        const BONE_KEYS = {
          hips: /j_bip_c_hips/i,
          spine: /j_bip_c_spine/i,
          chest: /j_bip_c_chest/i,
          upperChest: /j_bip_c_upperchest/i,
          neck: /j_bip_c_neck/i,
          head: /j_bip_c_head/i,
          leftUpperArm: /j_bip_l_upperarm/i,
          leftForearm: /j_bip_l_lowerarm/i,
          leftHand: /j_bip_l_hand/i,
          rightUpperArm: /j_bip_r_upperarm/i,
          rightForearm: /j_bip_r_lowerarm/i,
          rightHand: /j_bip_r_hand/i,
          leftThigh: /j_bip_l_upperleg/i,
          leftCalf: /j_bip_l_lowerleg/i,
          rightThigh: /j_bip_r_upperleg/i,
          rightCalf: /j_bip_r_lowerleg/i,
          leftFoot: /j_bip_l_foot/i,
          rightFoot: /j_bip_r_foot/i
        };

        this.root.traverse(function(node) {
          if (node.isMesh) {
            node.castShadow = true;
            node.receiveShadow = true;
            const hasMorphs = node.morphTargetDictionary && Object.keys(node.morphTargetDictionary).length > 0;

            if (node.material) {
              const mats = Array.isArray(node.material) ? node.material : [node.material];
              for (const mat of mats) {
                if (node.isSkinnedMesh) {
                  mat.skinning = true;
                }
                if (hasMorphs) {
                  mat.morphTargets = true;
                  mat.morphNormals = true;
                }
                mat.roughness = 0.45;
                mat.metalness = 0.15;
                mat.needsUpdate = true;
              }
            }

            if (hasMorphs) {
              self.morphMeshes.push(node);
              self.hasMorphs = true;
              const dict = node.morphTargetDictionary;
              for (const [name, idx] of Object.entries(dict)) {
                if (name === "Fcl_MTH_A") self.morphMap.mthA.push({ mesh: node, idx });
                else if (name === "Fcl_MTH_O" || name === "Fcl_MTH_U") self.morphMap.mthO.push({ mesh: node, idx });
                else if (name === "Fcl_MTH_I") self.morphMap.mthI.push({ mesh: node, idx });
                else if (name === "Fcl_MTH_E") self.morphMap.mthE.push({ mesh: node, idx });
                else if (name === "Fcl_MTH_Small") self.morphMap.mthSmall.push({ mesh: node, idx });
                else if (name === "Fcl_MTH_Joy") self.morphMap.mthJoy.push({ mesh: node, idx });
                else if (name === "Fcl_MTH_Surprised") self.morphMap.mthSurprised.push({ mesh: node, idx });
                else if (name === "Fcl_EYE_Close") self.morphMap.eyeBlink.push({ mesh: node, idx });
                else if (name === "Fcl_EYE_Close_R") self.morphMap.eyeWinkR.push({ mesh: node, idx });
                else if (name === "Fcl_EYE_Close_L") self.morphMap.eyeWinkL.push({ mesh: node, idx });
                else if (name === "Fcl_EYE_Joy") self.morphMap.eyeJoy.push({ mesh: node, idx });
                else if (name === "Fcl_EYE_Surprised") self.morphMap.eyeSurprised.push({ mesh: node, idx });
                else if (name === "Fcl_BRW_Joy") self.morphMap.brwJoy.push({ mesh: node, idx });
                else if (name === "Fcl_BRW_Fun") self.morphMap.brwFun.push({ mesh: node, idx });
                else if (name === "Fcl_BRW_Surprised") self.morphMap.brwSurprised.push({ mesh: node, idx });
                else if (name === "Fcl_ALL_Joy") self.morphMap.allJoy.push({ mesh: node, idx });
                else if (name === "Fcl_ALL_Surprised") self.morphMap.allSurprised.push({ mesh: node, idx });
                else if (name === "Fcl_ALL_Fun") self.morphMap.allFun.push({ mesh: node, idx });
                else if (name === "Fcl_ALL_Angry") self.morphMap.allAngry.push({ mesh: node, idx });
                else if (name === "Fcl_BRW_Angry") self.morphMap.brwAngry.push({ mesh: node, idx });
                else if (name === "Fcl_EYE_Angry") self.morphMap.eyeAngry.push({ mesh: node, idx });
                else if (name === "Fcl_MTH_Angry") self.morphMap.mthAngry.push({ mesh: node, idx });
                else if (name === "Fcl_ALL_Sorrow") self.morphMap.allSorrow.push({ mesh: node, idx });
                else if (name === "Fcl_MTH_Sorrow") self.morphMap.mthSorrow.push({ mesh: node, idx });
              }
            }
          }

          const nName = node.name || "";
          for (const [key, regex] of Object.entries(BONE_KEYS)) {
            if (!self.bones[key] && regex.test(nName)) {
              self.bones[key] = node;
              self.restRotations[key] = node.rotation.clone();
              break;
            }
          }
        });

        console.log("MoraCharacterController initialized. Bones:", Object.keys(this.bones).length, "Morph meshes:", this.morphMeshes.length);
      }

      setAnimations(clips) {
        if (!clips || clips.length === 0) return;
        for (let i = 0; i < clips.length; i++) {
          const clip = clips[i];
          const rawName = (clip.name || "").toLowerCase();
          try {
            const action = this.mixer.clipAction(clip);
            action.setLoop(THREE.LoopRepeat);
            this.actions[rawName] = action;
            if (rawName.includes("idle")) this.actions["idle"] = action;
            if (rawName.includes("talking") || rawName.includes("talk") || rawName.includes("speak")) {
              // Keep every talking variant (talking_0 AND talking_1). Previously each one
              // overwrote "talking"/"talking_0"/"talking_1", so only the last clip was ever used.
              if (!this.actions["talking"]) this.actions["talking"] = action;
              this.talkVariants = this.talkVariants || [];
              if (this.talkVariants.indexOf(rawName) === -1) this.talkVariants.push(rawName);
            }
            if (rawName.includes("wave")) this.actions["wave"] = action;
            if (rawName.includes("joy") || rawName.includes("laugh") || rawName.includes("cheer")) this.actions["joy"] = action;
            if (rawName.includes("learn") || rawName.includes("teach")) {
              this.actions["learn"] = action;
              this.actions["teach"] = action;
            }
            if (rawName.includes("thankful") || rawName.includes("thank") || rawName.includes("grateful")) {
              this.actions["thankful"] = action;
              this.actions["learn"] = this.actions["learn"] || action;
              this.actions["teach"] = this.actions["teach"] || action;
            }
            if (rawName.includes("clapping") || rawName.includes("clap")) this.actions["clapping"] = action;
            if (rawName.includes("excited") || rawName.includes("celebrate")) this.actions["excited"] = action;
            if (rawName.includes("dance")) this.actions["dance"] = action;
            if (rawName.includes("thinking") || rawName.includes("think")) this.actions["thinking"] = action;
            if (rawName.includes("crying") || rawName.includes("cry")) this.actions["crying"] = action;
          } catch (e) {
            console.warn("Error registering clip action", clip.name, e);
          }
        }
        this.hasClips = Object.keys(this.actions).length > 0;
        console.log("Mora clips active:", Object.keys(this.actions));
        this.fadeToAction("idle", 0.1);
      }

      fadeToAction(name, duration) {
        duration = duration !== undefined ? duration : 0.35;
        const targetAction = this.actions[name] || this.actions["idle"];
        if (!targetAction) return;

        if (this.activeAction === targetAction) {
          if (!targetAction.isRunning()) targetAction.play();
          return;
        }

        const prev = this.activeAction;
        this.activeAction = targetAction;
        this.activeActionName = name;

        targetAction.reset();
        targetAction.setEffectiveTimeScale(1);
        targetAction.setEffectiveWeight(1);
        if (prev && prev !== targetAction) {
          prev.crossFadeTo(targetAction, duration, true);
        }
        targetAction.play();
      }

      applyMorphGroup(group, targetVal, lerpSpeed, dt) {
        if (!group || group.length === 0) return;
        // Clamp the blend factor to [0,1]. With the raw dt*speed (up to 35x) any frame
        // hitch / throttled WebView frame (dt >= ~0.06s) overshot and diverged, leaving the
        // face stuck in extreme blend-shape values instead of moving with speech.
        const alpha = Math.min(1, Math.max(0, dt * lerpSpeed));
        for (let i = 0; i < group.length; i++) {
          const item = group[i];
          const cur = item.mesh.morphTargetInfluences[item.idx] || 0;
          item.mesh.morphTargetInfluences[item.idx] = THREE.MathUtils.lerp(cur, targetVal, alpha);
        }
      }

      interrupt() {
        // Instant Barge-In: Zero mouth visemes immediately
        for (const cat of ["mthA", "mthO", "mthI", "mthE", "mthSmall", "mthSurprised"]) {
          const grp = this.morphMap[cat];
          for (let i = 0; i < grp.length; i++) grp[i].mesh.morphTargetInfluences[grp[i].idx] = 0;
        }
        if (this.hasClips) this.fadeToAction("idle", 0.15);
      }

      update(dt, time, state, audioLevel, activeReaction, reactionTimer) {
        // 0. Enforce Physical Grounding Lock (Strictly zero vertical drifting)
        if (this.root) {
          this.root.position.set(0, -0.002, 0);
        }

        // 1. Skeletal Motion Blending (Jarvis AI Physical Body State Machine)
        if (this.hasClips) {
          let desired = "idle";
          if (activeReaction === "dance" || activeReaction === "rumba") {
            desired = "dance";
          } else if (activeReaction === "joy" || activeReaction === "laugh" || activeReaction === "success") {
            desired = "joy";
          } else if (activeReaction === "wave") {
            desired = "wave";
          } else if (activeReaction === "thankful" || activeReaction === "thank" || activeReaction === "grateful") {
            desired = "thankful";
          } else if (activeReaction === "clapping" || activeReaction === "clap") {
            desired = "clapping";
          } else if (activeReaction === "excited" || activeReaction === "celebrate" || activeReaction === "party") {
            desired = "excited";
          } else if (activeReaction === "nod" || activeReaction === "blush" || activeReaction === "headpat" || activeReaction === "shy") {
            // Previously "nod" fell into the thinking clip and "blush" had no body clip at all,
            // so 2 of the 5 tap reactions looked like nothing happened.
            desired = "thankful";
          } else if (activeReaction === "teach" || activeReaction === "learn" || activeReaction === "executing") {
            desired = "thinking";
          } else if (activeReaction === "curious" || activeReaction === "thinking" || activeReaction === "failed") {
            desired = "thinking";
          } else if (activeReaction === "surprise" || activeReaction === "poke") {
            desired = "excited";
          } else if (activeReaction === "cry" || activeReaction === "crying" || activeReaction === "sad") {
            desired = "crying";
          } else if (state === "speaking") {
            // Alternate between all talking gesture variants (~4s each) for natural speech body language
            const variants = this.talkVariants || [];
            desired = variants.length > 1 ? variants[Math.floor(time / 4.0) % variants.length] : "talking";
          } else if (state === "thinking") {
            desired = "thinking";
          } else if (state === "listening") {
            // Attentive listening posture (uses grounded idle with alert gaze kinematics)
            desired = "idle";
          } else {
            desired = "idle";
          }

          this.fadeToAction(desired, 0.28);
          this.mixer.update(dt);
        }

        // 2. Phonetic Viseme Lip-Sync (Mouth opens & closes with words)
        // Driven by the real TTS / Gemini playback amplitude (JarvisConversationService
        // onPlaybackAmplitude -> setExternalAudio). Previously the mouth was a fixed 2Hz sine
        // that flapped identically whether Jarvis was mid-word or silent between sentences.
        // Mic amplitude never opens the mouth: lip-sync stays gated on state === "speaking".
        const isSpeaking = (state === "speaking");
        const rawVol = audioLevel > 0.012 ? audioLevel : 0;

        // Adaptive gain: playback RMS is device/voice dependent, so normalise against a slowly
        // decaying recent peak (floor 0.08 so background hiss can't fully open the mouth).
        this.audioPeak = Math.max(0.08, Math.max(this.audioPeak || 0, rawVol) - dt * 0.05);
        const norm = Math.min(1, rawVol / this.audioPeak);
        // Fast attack / slower release envelope so syllables read as distinct mouth shapes
        const envRate = norm > (this.speechEnv || 0) ? 30 : 12;
        this.speechEnv = THREE.MathUtils.lerp(this.speechEnv || 0, isSpeaking ? norm : 0, Math.min(1, dt * envRate));
        if (rawVol > 0) this.lastVoiceTime = time;
        const hasLiveAudio = isSpeaking && (time - (this.lastVoiceTime || -99)) < 0.6;

        let targetA = 0;
        let targetO = 0;
        let targetI = 0;
        let targetE = 0;

        if (isSpeaking) {
          let opening;
          if (hasLiveAudio) {
            // Real audio envelope with light syllable texture so long vowels don't freeze open
            opening = Math.pow(this.speechEnv, 0.75) * (0.72 + 0.28 * Math.abs(Math.sin(time * 11.0)));
          } else {
            // Fallback when no amplitude stream arrives (e.g. offline TTS without metering)
            const syllPhase = (time * 13.0) % (Math.PI * 2);
            opening = Math.pow(Math.max(0, Math.sin(syllPhase)), 1.4) * (0.75 + Math.sin(time * 5.0) * 0.20);
          }
          opening = Math.min(1, opening);

          // Sequenced alternating vowels across syllables: A -> O -> I -> E -> A
          const syllCycle = Math.floor((time * 13.0) / (Math.PI * 2)) % 4;
          if (syllCycle === 0) targetA = opening * 0.95;
          else if (syllCycle === 1) { targetO = opening * 0.85; targetA = opening * 0.25; }
          else if (syllCycle === 2) { targetI = opening * 0.70; targetA = opening * 0.20; }
          else { targetE = opening * 0.75; targetA = opening * 0.20; }
        }

        // REDMAGIC rim light breathes with state: brighter while listening, pulses with voice
        const rimTarget = isSpeaking ? 0.55 + this.speechEnv * 0.45 : (state === "listening" ? 0.75 : (state === "thinking" ? 0.62 : 0.55));
        moraRimUniforms.uMoraRimStrength.value = THREE.MathUtils.lerp(moraRimUniforms.uMoraRimStrength.value, rimTarget, Math.min(1, dt * 8));
        pedestalGlow.intensity = 1.0 + moraRimUniforms.uMoraRimStrength.value * 0.9;

        this.applyMorphGroup(this.morphMap.mthA, targetA, 28, dt);
        this.applyMorphGroup(this.morphMap.mthO, targetO, 24, dt);
        this.applyMorphGroup(this.morphMap.mthI, targetI, 24, dt);
        this.applyMorphGroup(this.morphMap.mthE, targetE, 24, dt);

        // 3. Facial Reactions & Expressions
        let targetAllJoy = 0;
        let targetMthJoy = 0;
        let targetEyeJoy = 0;
        let targetBrwJoy = 0;

        let targetAllSurprised = 0;
        let targetMthSurprised = 0;
        let targetEyeSurprised = 0;
        let targetBrwSurprised = 0;

        let targetWinkR = 0;
        let targetBrwFun = 0;
        let targetMthSmall = 0;
        let targetAllFun = 0;

        if (activeReaction === "joy" || activeReaction === "laugh" || activeReaction === "success") {
          targetAllJoy = 0.90;
          targetMthJoy = 0.95;
          targetEyeJoy = 0.90;
          targetBrwJoy = 0.85;
        } else if (activeReaction === "thankful" || activeReaction === "thank" || activeReaction === "grateful") {
          targetMthJoy = 0.80;
          targetBrwJoy = 0.55;
          targetEyeJoy = 0.60;
        } else if (activeReaction === "clapping" || activeReaction === "clap") {
          targetMthJoy = 0.85;
          targetBrwJoy = 0.70;
          targetAllFun = 0.35;
        } else if (activeReaction === "excited" || activeReaction === "celebrate" || activeReaction === "party") {
          targetAllJoy = 0.95;
          targetMthJoy = 1.0;
          targetEyeJoy = 0.95;
          targetBrwJoy = 0.90;
          targetAllSurprised = 0.45;
        } else if (activeReaction === "wave") {
          targetWinkR = 1.0;
          targetMthJoy = 0.70;
          targetBrwJoy = 0.60;
        } else if (activeReaction === "teach" || activeReaction === "learn" || activeReaction === "nod" || activeReaction === "executing") {
          targetBrwFun = 0.75;
          targetMthSmall = 0.35;
          targetAllFun = 0.50;
        } else if (activeReaction === "blush" || activeReaction === "headpat" || activeReaction === "shy" || activeReaction === "nod") {
          // Shy happy face for head pats (closed happy eyes + soft smile)
          targetMthJoy = 0.75;
          targetEyeJoy = 0.85;
          targetBrwJoy = 0.60;
          targetAllFun = 0.25;
        } else if (activeReaction === "curious" || activeReaction === "poke" || activeReaction === "surprise") {
          targetAllSurprised = 0.95;
          targetEyeSurprised = 0.95;
          targetMthSurprised = 0.80;
          targetBrwSurprised = 0.85;
        }

        // Natural eyelid blinking: 110ms duration every 3.2s
        // Natural blinking at irregular 2-6 s gaps (a fixed 3.2 s metronome looked robotic)
        if (!this.nextBlink) this.nextBlink = time + 2 + Math.random() * 3;
        if (time > this.nextBlink) { this.blinkUntil = time + 0.12; this.nextBlink = time + 2.2 + Math.random() * 4.0; }
        const isBlinking = (time < (this.blinkUntil || 0) && targetWinkR === 0) ? 1.0 : 0.0;

        this.applyMorphGroup(this.morphMap.eyeBlink, isBlinking, 35, dt);
        this.applyMorphGroup(this.morphMap.eyeWinkR, targetWinkR, 28, dt);
        this.applyMorphGroup(this.morphMap.allJoy, targetAllJoy, 14, dt);
        this.applyMorphGroup(this.morphMap.mthJoy, targetMthJoy, 14, dt);
        this.applyMorphGroup(this.morphMap.eyeJoy, targetEyeJoy, 14, dt);
        this.applyMorphGroup(this.morphMap.brwJoy, targetBrwJoy, 14, dt);
        this.applyMorphGroup(this.morphMap.allSurprised, targetAllSurprised, 20, dt);
        this.applyMorphGroup(this.morphMap.eyeSurprised, targetEyeSurprised, 20, dt);
        this.applyMorphGroup(this.morphMap.mthSurprised, targetMthSurprised, 20, dt);
        this.applyMorphGroup(this.morphMap.brwSurprised, targetBrwSurprised, 20, dt);
        this.applyMorphGroup(this.morphMap.brwFun, targetBrwFun, 14, dt);
        this.applyMorphGroup(this.morphMap.mthSmall, targetMthSmall, 14, dt);
        this.applyMorphGroup(this.morphMap.allFun, targetAllFun, 14, dt);

        // 4. Additive Kinematics: Clamped Conversational Head Tilts & Eye Gaze
        if (this.hasClips && this.bones.head) {
          const targetGazeX = this.gazeX * 0.35;
          const targetGazeY = -this.gazeY * 0.25;
          let tiltZ = 0, pitchX = 0;

          if (state === "listening") {
            tiltZ = 0.08;
            pitchX = -0.04;
          } else if (state === "thinking") {
            tiltZ = -0.10;
            pitchX = -0.06;
          } else if (activeReaction === "wave") {
            tiltZ = 0.06;
          } else if (activeReaction === "teach" || activeReaction === "learn" || activeReaction === "nod" || activeReaction === "headpat") {
            pitchX = -Math.abs(Math.sin(time * 3.2)) * 0.08;
          } else if (activeReaction === "curious") {
            tiltZ = 0.12;
            pitchX = -0.04;
          }

          const speechNod = isSpeaking ? -Math.abs(Math.sin(time * 3.0)) * (0.02 + rawVol * 0.04) : 0;

          this.curGazeX = THREE.MathUtils.lerp(this.curGazeX, targetGazeX, dt * 5.0);
          this.curGazeY = THREE.MathUtils.lerp(this.curGazeY, targetGazeY + pitchX + speechNod, dt * 5.0);
          this.headRoll = THREE.MathUtils.lerp(this.headRoll, tiltZ, dt * 5.0);

          const clampedPitch = Math.max(-0.15, Math.min(0.08, this.curGazeY));
          const clampedYaw = Math.max(-0.25, Math.min(0.25, this.curGazeX));
          const clampedRoll = Math.max(-0.15, Math.min(0.15, this.headRoll));

          const additiveQ = new THREE.Quaternion().setFromEuler(new THREE.Euler(clampedPitch, clampedYaw, clampedRoll, 'YXZ'));
          this.bones.head.quaternion.multiply(additiveQ);
        }

        // 5. Human idle layer (additive, on top of the clip). The retargeted idle clip barely
        //    moves (max ~0.15 rad) and keeps the elbows dead straight, so she stood like a
        //    mannequin. This adds breathing, a slow weight shift, relaxed elbows and small
        //    "alive" moments (glances, head tilts, a smile) while she is calm.
        this.updateHumanIdle(dt, time, state, activeReaction);
        this.updateTouchMood(dt, time);
      }

      // RedMagic-style personality: angry / embarrassed / sulking moods from touches.
      updateTouchMood(dt, time) {
        const m = touchMood;
        const active = m && time < m.until;
        const angry = active && (m.type === "angry" || m.type === "sulk");
        const annoyed = active && m.type === "annoyed";
        const embarrassed = active && m.type === "embarrassed";
        const k = active ? Math.min(1, (time - m.start) * 6) : 0; // fast onset
        this.applyMorphGroup(this.morphMap.allAngry, angry ? 0.85 * k : (annoyed ? 0.45 * k : 0), 12, dt);
        this.applyMorphGroup(this.morphMap.brwAngry, (angry || annoyed) ? 0.9 * k : 0, 12, dt);
        this.applyMorphGroup(this.morphMap.eyeAngry, angry ? 0.7 * k : 0, 12, dt);
        this.applyMorphGroup(this.morphMap.mthAngry, angry ? 0.8 * k : (annoyed ? 0.4 * k : 0), 12, dt);
        const sulky = !active && grudgeActive();
        if (sulky) {
          this.applyMorphGroup(this.morphMap.brwAngry, 0.35, 6, dt);
          this.applyMorphGroup(this.morphMap.mthAngry, 0.15, 6, dt);
        }
        if (active && m.type === "bliss" && this.bones.neck) this.rotAdd(this.bones.neck, "z", 0.14 * k);
        this.applyMorphGroup(this.morphMap.allSorrow, embarrassed ? 0.55 * k : 0, 10, dt);
        this.applyMorphGroup(this.morphMap.mthSorrow, embarrassed ? 0.5 * k : 0, 10, dt);

        // Head: quick "no" shake right after an unwanted touch, chin away while angry
        if (active && (angry || annoyed || embarrassed) && this.bones.neck) {
          const since = time - m.start;
          const shake = since < 0.9 ? Math.sin(since * 22) * 0.22 * (1 - since / 0.9) : 0;
          this.rotAdd(this.bones.neck, "y", shake + (angry ? 0.18 : 0) * k);
          this.rotAdd(this.bones.neck, "z", embarrassed ? -0.08 * k : 0);
        }
        // Sulk: chin up and face turned further away from you ("hmph!")
        if (active && m.type === "sulk" && this.bones.neck) {
          this.rotAdd(this.bones.neck, "y", 0.32 * k);
          this.rotAdd(this.bones.neck, "x", -0.10 * k);
        }
      }

      rotAdd(bone, axis, angle) {
        if (!bone || !angle) return;
        const q = this._tmpQ || (this._tmpQ = new THREE.Quaternion());
        const v = axis === "x" ? AXIS_X : (axis === "y" ? AXIS_Y : AXIS_Z);
        q.setFromAxisAngle(v, angle);
        bone.quaternion.multiply(q);
      }

      updateHumanIdle(dt, time, state, activeReaction) {
        if (!this.hasClips) return;
        const b = this.bones;
        const calm = (activeReaction === "none" || !activeReaction) && (state === "idle" || state === "listening");
        const talking = state === "speaking";
        this.idleBlend = THREE.MathUtils.lerp(this.idleBlend || 0, calm ? 1 : (talking ? 0.55 : 0.25), Math.min(1, dt * 2.5));
        const w = this.idleBlend;

        // Breathing (~14 breaths/min) through chest + upper chest
        const breath = Math.sin(time * 1.5);
        this.rotAdd(b.chest, "x", breath * 0.016 * w);
        this.rotAdd(b.upperChest, "x", breath * 0.012 * w);

        // Slow weight shift from one leg to the other, the spine counter-balances
        const sway = Math.sin(time * 0.4);
        this.rotAdd(b.hips, "z", sway * 0.022 * w);
        this.rotAdd(b.spine, "z", -sway * 0.016 * w);
        this.rotAdd(b.hips, "y", Math.sin(time * 0.23) * 0.035 * w);
        this.rotAdd(b.leftThigh, "z", -sway * 0.012 * w);
        this.rotAdd(b.rightThigh, "z", -sway * 0.012 * w);

        // Relaxed, slightly bent elbows that drift a little (never mannequin-straight)
        this.rotAdd(b.leftForearm, "y", (ELBOW_BEND + Math.sin(time * 0.9) * 0.025) * w * ELBOW_SIGN_L);
        this.rotAdd(b.rightForearm, "y", (ELBOW_BEND + Math.sin(time * 0.9 + 1.3) * 0.025) * w * ELBOW_SIGN_R);

        // Small "alive" moments every 6-12 s: glance aside, tilt the head, look down, or smile
        if (calm) {
          if (!this.nextIdleAct) this.nextIdleAct = time + 4 + Math.random() * 4;
          if (time > this.nextIdleAct && !this.idleAct) {
            const acts = ["glanceL", "glanceR", "tilt", "smile", "lookDown"];
            const forced = _qp.get("act");
            this.idleAct = { type: forced || acts[Math.floor(Math.random() * acts.length)], until: time + 1.6 + Math.random() * 1.4 };
            this.nextIdleAct = time + 6 + Math.random() * 6;
          }
        }
        if (this.idleAct && (time > this.idleAct.until || !calm)) this.idleAct = null;
        const act = this.idleAct ? this.idleAct.type : null;
        const gx = act === "glanceL" ? 0.45 : (act === "glanceR" ? -0.45 : 0);
        const gy = act === "lookDown" ? 0.25 : 0;
        this.autoGazeX = THREE.MathUtils.lerp(this.autoGazeX || 0, gx, Math.min(1, dt * 3));
        this.autoGazeY = THREE.MathUtils.lerp(this.autoGazeY || 0, gy, Math.min(1, dt * 3));
        this.autoTilt = THREE.MathUtils.lerp(this.autoTilt || 0, act === "tilt" ? 0.12 : 0, Math.min(1, dt * 3));
        if (b.neck) {
          this.rotAdd(b.neck, "y", this.autoGazeX * 0.35);
          this.rotAdd(b.neck, "x", this.autoGazeY * 0.3);
          this.rotAdd(b.neck, "z", this.autoTilt);
        }
        if (act === "smile") this.applyMorphGroup(this.morphMap.mthJoy, 0.45, 6, dt);
      }
    }

    /* =========================================================================
       Model Loading & State Machine
       ========================================================================= */
    let moraController = null;
    let moraPivot = null;
    const viewer = { x: 0, y: 0, present: false, at: 0, goneAt: performance.now() };
    function setViewer(x, y, present) {
      const now = performance.now();
      const was = viewer.present && (now - viewer.at) < 1500;
      if (present) {
        if (!was && now - viewer.goneAt > 20000 && moraController) {
          if (grudgeActive()) say("Hmph 😒", "annoyed");
          else { triggerMoraReaction("wave"); say(["Aa gaye! 😊", "Kahan the itni der? 🥺", "Hi! 👋"][Math.floor(Math.random() * 3)], "happy"); }
        }
        viewer.x = Math.max(-1, Math.min(1, Number(x) || 0));
        viewer.y = Math.max(-1, Math.min(1, Number(y) || 0));
        viewer.present = true; viewer.at = now;
      } else {
        if (was) viewer.goneAt = now;
        viewer.present = false;
      }
    }
    let moraModel = null;
    let currentState = "idle";
    let activeReaction = "none";
    let reactionTimer = 0;
    let extAudioLevel = 0;
    let extAudioTime = 0;          // performance.now() of the last setExternalAudio push
    let moraIdleDotColor = "#FF0055";
    let clock = new THREE.Clock();

    function setMoraState(state) {
      const prev = currentState;
      currentState = (state || "idle").toLowerCase();
      if (currentState !== "idle") { try { noteInteraction(); } catch (_) {} }
      if (hudState) hudState.textContent = "MORA • " + currentState.toUpperCase();
      if (hudDot) {
        let dot = moraIdleDotColor;
        if (currentState === "speaking") dot = "#00F0FF";
        else if (currentState === "listening") dot = "#10B981";
        else if (currentState === "thinking") dot = "#F59E0B";
        hudDot.style.background = dot;
        hudDot.style.boxShadow = "0 0 8px " + dot;
      }

      // Barge-in interruption
      if (prev === "speaking" && currentState !== "speaking") {
        extAudioLevel = 0;
        if (moraController) moraController.interrupt();
      }
    }

    function triggerMoraReaction(reaction) {
      activeReaction = (reaction || "").toLowerCase();
      // "stop" / "none" (HomeFragment barge-in) clears the current emote instead of
      // starting an unknown 2.5s reaction that froze whatever clip was playing.
      if (activeReaction === "stop" || activeReaction === "none" || activeReaction === "") {
        activeReaction = "none";
        reactionTimer = 0;
        return;
      }
      if (activeReaction === "dance") reactionTimer = 7.5;
      else if (activeReaction === "joy" || activeReaction === "laugh" || activeReaction === "success") reactionTimer = 5.0;
      else if (activeReaction === "wave") reactionTimer = 4.1;
      else if (activeReaction === "thankful" || activeReaction === "thank" || activeReaction === "grateful") reactionTimer = 4.5;
      else if (activeReaction === "clapping" || activeReaction === "clap") reactionTimer = 4.5;
      else if (activeReaction === "excited" || activeReaction === "celebrate" || activeReaction === "party") reactionTimer = 5.0;
      else if (activeReaction === "teach" || activeReaction === "learn" || activeReaction === "executing") reactionTimer = 3.5;
      else if (activeReaction === "failed" || activeReaction === "curious" || activeReaction === "thinking") reactionTimer = 3.0;
      else if (activeReaction === "surprise" || activeReaction === "poke") reactionTimer = 2.8;
      else if (activeReaction === "cry" || activeReaction === "crying" || activeReaction === "sad") reactionTimer = 4.0;
      else if (activeReaction === "blush" || activeReaction === "headpat" || activeReaction === "shy" || activeReaction === "nod") reactionTimer = 3.0;
      else reactionTimer = 2.5;
      console.log("Mora reaction triggered:", activeReaction, "timer:", reactionTimer);
    }

    /* Touch & Poke Reaction Handler
       - Zone aware: head pat / body poke / tap beside her (projected from live bones)
       - De-duplicated: on Home the canvas "click" AND HomeFragment's GestureDetector
         (JarvisOrb.triggerTouchReaction) both fired for the same tap, advancing the
         cycle twice and restarting the reaction ~300ms later.
       - Every pool entry maps to a real body clip (old pool had nod/blush/curious which
         resolved to the thinking clip or no clip at all). */
    let reactionCycle = 0;
    let lastPokeAt = 0;
    let touchMood = null;          // { type, start, until }
    let annoyance = 0;             // grows with unwanted touches, decays over time
    let lastAnnoyAt = 0;
    let lastFaceTouchAt = 0;
    let turnTarget = 0;            // radians she turns her body away
    let backTarget = 0;            // how far she steps back

    // What she says (Hinglish), shown in the bubble and sent to Jarvis' voice when live.
    const TOUCH_LINES = {
      headtop: ["Hehe~ achha lagta hai 😊", "Aww, aur karo 🥰", "Hmm~ 😌"],
      face: ["Ei! 😳", "Arre, gaal mat kheencho!", "Hehe, kya hai? 😄"],
      faceAgain: ["Bas bhi karo na! 😒", "Chehra chhodo, baat karo 😤"],
      hand: ["Hi! 👋", "High five! ✋", "Haath milao, dost 🤝"],
      arm: ["Haan? Bolo na 🙂", "Kya hua? 👀"],
      belly: ["Hahaha gudgudi hoti hai! 😆", "Hehe, mat karo! 😂"],
      chest: ["Hey! Wahan nahi! 😠", "Ye kya kar rahe ho?! 😳", "Tameez se pesh aao! 😤"],
      hips: ["Excuse me?! 😡", "Haath door rakho! 😠", "Bilkul nahi! 😤"],
      legs: ["Pair mat chhuo na 😒", "Hey, gudgudi! 😅"],
      outside: ["Main yahan hoon! 👋", "Idhar dekho~ 😊"],
      sulk: ["Hmph! 😤 Pehle sorry bolo.", "Main naraz hoon. 😒"]
    };
    // ---- Mood memory: a sulk survives reloads / app restarts until she hears "sorry" (max 10 min)
    const MOOD_KEY = "mora_mood_v1";
    let grudgeUntil = 0;           // epoch ms
    function saveMood() {
      try { localStorage.setItem(MOOD_KEY, JSON.stringify({ annoyance, grudgeUntil, savedAt: Date.now() })); } catch (_) {}
    }
    function loadMood() {
      try {
        const m = JSON.parse(localStorage.getItem(MOOD_KEY) || "{}");
        grudgeUntil = Number(m.grudgeUntil) || 0;
        const ageMin = (Date.now() - (Number(m.savedAt) || 0)) / 60000;
        annoyance = Math.max(0, (Number(m.annoyance) || 0) - ageMin * 4); // ~1 point per 15 s
      } catch (_) {}
    }
    function grudgeActive() { return Date.now() < grudgeUntil; }
    function forgive() {
      if (!grudgeActive() && annoyance < 1 && !(touchMood && touchMood.type === "sulk")) return false;
      annoyance = 0; grudgeUntil = 0; touchMood = null; turnTarget = 0; backTarget = 0;
      addBond(3); noteInteraction();
      saveMood();
      triggerMoraReaction("thankful"); reactionTimer = 4.5;
      const line = ["Theek hai, maaf kiya 🥰", "Hmm… chalo maan gayi 😊", "Aage se dhyan rakhna, haan? 😌"][Math.floor(Math.random() * 3)];
      // "Sorry" usually comes through Gemini Live, which already answers in its own voice
      let live = false;
      try { live = !!(window.Jarvis3DModelBridge && window.Jarvis3DModelBridge.isVoiceLive && window.Jarvis3DModelBridge.isVoiceLive()); } catch (_) {}
      if (live) showBubble(line, "happy"); else say(line, "happy");
      return true;
    }
    loadMood();

    function pickLine(key) { const a = TOUCH_LINES[key] || TOUCH_LINES.outside; return a[Math.floor(Math.random() * a.length)]; }

    // ---- Thought bubble beside her head (follows the head every frame), and her voice.
    let bubbleUntil = 0;
    let localTalkUntil = 0;        // on-device voice is speaking her line -> move the lips
    function ensureBubble() {
      let el = document.getElementById("moraBubble");
      if (el) return el;
      el = document.createElement("div");
      el.id = "moraBubble";
      el.style.cssText = "position:fixed;left:0;top:0;max-width:46vw;padding:8px 12px;border-radius:14px;" +
        "font:600 13px/1.3 Inter,system-ui,sans-serif;color:#FAFAFA;background:rgba(24,24,27,.86);" +
        "border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);" +
        "box-shadow:0 6px 24px rgba(0,0,0,.45);opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:20";
      document.body.appendChild(el);
      for (let i = 0; i < 2; i++) {
        const d = document.createElement("div");
        d.id = "moraBubbleDot" + i;
        const sz = i === 0 ? 9 : 5;
        d.style.cssText = "position:fixed;width:" + sz + "px;height:" + sz + "px;border-radius:50%;background:rgba(24,24,27,.86);" +
          "border:1px solid rgba(255,255,255,.16);opacity:0;transition:opacity .2s ease;pointer-events:none;z-index:20";
        document.body.appendChild(d);
      }
      return el;
    }
    function placeBubble() {
      const el = document.getElementById("moraBubble");
      if (!el || !moraController) return;
      const head = screenPosOfBone(moraController.bones.head);
      const hips = screenPosOfBone(moraController.bones.hips);
      if (!head || !hips) return;
      const unit = Math.max(24, Math.abs(hips.y - head.y));
      const W = window.innerWidth, H = window.innerHeight;
      const bw = el.offsetWidth, bh = el.offsetHeight;
      const right = head.x < W * 0.55;                 // put it on the side with more room
      let x = right ? head.x + unit * 0.32 : head.x - unit * 0.32 - bw;
      let y = head.y - unit * 0.30 - bh;
      x = Math.max(8, Math.min(W - bw - 8, x));
      y = Math.max(6, Math.min(H - bh - 6, y));
      el.style.left = x + "px"; el.style.top = y + "px";
      // two small "thinking" dots from the head to the bubble
      const ax = right ? x + 10 : x + bw - 10, ay = y + bh;
      const hx = head.x + (right ? unit * 0.14 : -unit * 0.14), hy = head.y - unit * 0.10;
      [0.45, 0.75].forEach((t, i) => {
        const d = document.getElementById("moraBubbleDot" + i);
        if (!d) return;
        d.style.left = (ax + (hx - ax) * t - (i === 0 ? 4.5 : 2.5)) + "px";
        d.style.top = (ay + (hy - ay) * t - (i === 0 ? 4.5 : 2.5)) + "px";
      });
    }
    function setBubbleVisible(on) {
      ["moraBubble", "moraBubbleDot0", "moraBubbleDot1"].forEach(id => {
        const d = document.getElementById(id); if (d) d.style.opacity = on ? "1" : "0";
      });
    }
    function showBubble(text, mood) {
      const el = ensureBubble();
      el.textContent = text;
      el.style.borderColor = (mood === "angry" || mood === "sulk") ? "rgba(239,68,68,.6)" :
        (mood === "embarrassed" ? "rgba(244,114,182,.6)" : "rgba(255,255,255,.16)");
      placeBubble();
      setBubbleVisible(true);
      bubbleUntil = performance.now() + Math.min(5200, 2000 + text.length * 70);
    }
    // The page asked Android to speak; "local" means the on-device voice -> animate her lips.
    function voiceStarted(result, text) {
      if (result === "local") localTalkUntil = performance.now() + Math.min(5000, 700 + String(text || "").length * 75);
    }
    // A line she says on her own (not from a touch): bubble + voice.
    function say(text, mood) {
      showBubble(text, mood);
      try {
        if (window.Jarvis3DModelBridge && typeof window.Jarvis3DModelBridge.speakLine === "function") {
          voiceStarted(window.Jarvis3DModelBridge.speakLine(text, mood || ""), text);
        }
      } catch (_) {}
    }

    function screenPosOfBone(bone) {
      if (!bone) return null;
      const v = new THREE.Vector3();
      bone.getWorldPosition(v);
      v.project(camera);
      const rect = canvas.getBoundingClientRect();
      return { x: rect.left + (v.x + 1) / 2 * rect.width, y: rect.top + (1 - v.y) / 2 * rect.height };
    }

    // Zones from the live skeleton projected to the screen (works at any framing / pose).
    function classifyTouch(x, y) {
      if (!moraController || typeof x !== "number") return "belly";
      const b = moraController.bones;
      const P = (k) => screenPosOfBone(b[k]);
      const head = P("head"), neck = P("neck") || head, upper = P("upperChest") || P("chest"), hips = P("hips");
      if (!head || !hips) return "belly";
      const knee = P("leftCalf") || hips, foot = P("leftFoot") || knee;
      const unit = Math.max(24, Math.abs(hips.y - head.y));
      const d = (a) => a ? Math.hypot(x - a.x, y - a.y) : 1e9;
      if (Math.min(d(P("leftHand")), d(P("rightHand"))) < unit * 0.2) return "hand";
      if (Math.min(d(P("leftForearm")), d(P("rightForearm")), d(P("leftUpperArm")), d(P("rightUpperArm"))) < unit * 0.17) return "arm";
      if (y < head.y - unit * 0.1 && Math.abs(x - head.x) < unit * 0.38) return "headtop";
      if (d(head) < unit * 0.3) return "face";
      const torsoHalf = unit * 0.33;
      if (Math.abs(x - hips.x) < torsoHalf) {
        const chestBottom = (upper ? upper.y : neck.y) + (hips.y - (upper ? upper.y : neck.y)) * 0.45;
        if (y > neck.y + unit * 0.05 && y <= chestBottom) return "chest";
        if (y > chestBottom && y <= hips.y - unit * 0.12) return "belly";
      }
      if (Math.abs(x - hips.x) < unit * 0.42 && y > hips.y - unit * 0.12 && y <= knee.y - unit * 0.1) return "hips";
      if (Math.abs(x - hips.x) < unit * 0.42 && y > knee.y - unit * 0.1 && y <= foot.y + unit * 0.25) return "legs";
      return "outside";
    }

    function setMood(type, seconds) {
      const t = clock.getElapsedTime();
      touchMood = { type, start: t, until: t + seconds };
    }

    function notifyHost(zone, mood, line) {
      try {
        if (window.Jarvis3DModelBridge && typeof window.Jarvis3DModelBridge.onModelTouched === "function") {
          voiceStarted(window.Jarvis3DModelBridge.onModelTouched(zone, mood, line), line);
        } else if (window.Jarvis3DModelBridge && typeof window.Jarvis3DModelBridge.onModelTouchReact === "function") {
          window.Jarvis3DModelBridge.onModelTouchReact();
        }
      } catch (_) {}
    }

    function handleTouchZone(zone) {
      const now = clock.getElapsedTime();
      // annoyance cools down by 1 every 15 s
      if (annoyance > 0) annoyance = Math.max(0, annoyance - (now - lastAnnoyAt) / 15);
      // Sulking: she ignores everything but says so
      if (touchMood && touchMood.type === "sulk" && now < touchMood.until) {
        const line = pickLine("sulk"); showBubble(line, "sulk"); notifyHost(zone, "sulk", line);
        turnTarget = 1.0; return;
      }
      if (grudgeActive() && zone !== "chest" && zone !== "hips") {
        setMood("annoyed", 2.4); triggerMoraReaction("none");
        const line = ["Main abhi bhi naraz hoon 😒 Sorry bolo.", "Hmph. Pehle sorry. 😤"][Math.floor(Math.random() * 2)];
        showBubble(line, "annoyed"); notifyHost(zone, "annoyed", line);
        return;
      }
      let mood = "happy", key = zone;
      switch (zone) {
        case "headtop": triggerMoraReaction("headpat"); mood = "shy"; break;
        case "face":
          if (now - lastFaceTouchAt < 6) { key = "faceAgain"; mood = "annoyed"; setMood("annoyed", 2.6); triggerMoraReaction("none"); }
          else { triggerMoraReaction("surprise"); mood = "surprised"; }
          lastFaceTouchAt = now; break;
        case "hand": triggerMoraReaction(Math.random() < 0.6 ? "wave" : "thankful"); break;
        case "arm": triggerMoraReaction("curious"); mood = "curious"; break;
        case "belly": triggerMoraReaction("joy"); mood = "ticklish"; break;
        case "legs": triggerMoraReaction("none"); mood = "annoyed"; setMood("annoyed", 2.4); backTarget = 0.08; break;
        case "chest":
        case "hips": {
          triggerMoraReaction("none");
          annoyance += zone === "hips" ? 1.5 : 1; lastAnnoyAt = now;
          if (annoyance >= 3) {
            key = "sulk"; mood = "sulk"; setMood("sulk", 9); turnTarget = 1.0; backTarget = 0.14;
            grudgeUntil = Date.now() + 10 * 60 * 1000;
          } else if (annoyance >= 1.5) {
            mood = "angry"; setMood("angry", 3.4); turnTarget = 0.6; backTarget = 0.16;
          } else {
            mood = "embarrassed"; setMood("embarrassed", 2.8); turnTarget = 0.32; backTarget = 0.12;
          }
          break;
        }
        default: triggerMoraReaction("wave");
      }
      const line = pickLine(key);
      showBubble(line, mood);
      notifyHost(zone, mood, line);
      noteInteraction();
      addBond({ sulk: -3, angry: -2, embarrassed: -1, annoyed: -0.5 }[mood] ?? 1);
      saveMood();
      console.log("Mora touch:", zone, "->", mood, "| annoyance", annoyance.toFixed(2));
    }

    function onTouchPoke(e) {
      const now = performance.now();
      if (now - lastPokeAt < 650) return; // same physical tap delivered twice (canvas + Kotlin)
      lastPokeAt = now;
      const zone = (e && typeof e.clientX === "number") ? classifyTouch(e.clientX, e.clientY) : "belly";
      handleTouchZone(zone);
    }

    // Test hooks: ?viewer=x,y fakes a face position, ?forgive=1 fakes hearing "sorry".
    if (_qp.get("viewer")) { const v = _qp.get("viewer").split(",").map(Number); setInterval(() => setViewer(v[0], v[1] || 0, true), 400); }
    if (_qp.has("forgive")) setTimeout(() => console.log("forgive ->", forgive()), 8000);
    // Test hook: ?touch=<zone>[,<zone>...] fires those zones after the model is ready.
    if (_qp.get("touch")) {
      const zones = _qp.get("touch").split(",");
      zones.forEach((z, i) => setTimeout(() => { lastPokeAt = 0; handleTouchZone(z.trim()); }, 7000 + i * 900));
    }

    // ---- Touch input: tap = reaction, long press = long pat, swipe = turn her, pinch = zoom
    let dragging = false;
    let lastX = 0, lastY = 0, downX = 0, downY = 0;
    let manualYaw = 0;
    let suppressClick = false;
    let longTimer = null;
    const pointers = new Map();
    let pinch0 = 0, zoom0 = 1;
    let camZoom = 1;
    try { camZoom = Math.max(0.75, Math.min(1.8, parseFloat(localStorage.getItem("mora_zoom")) || 1)); } catch (_) {}
    camera.zoom = camZoom; camera.updateProjectionMatrix();

    function handleLongPress(x, y) {
      const zone = classifyTouch(x, y);
      if ((zone === "headtop" || zone === "face") && !grudgeActive()) {
        lastPokeAt = performance.now();
        triggerMoraReaction("headpat"); reactionTimer = 4.5;
        setMood("bliss", 4.5); addBond(2); noteInteraction();
        const line = ["Hmm~ 😌 aise hi karte raho", "Kitna sukoon hai… 🥰", "Mmm, achha lag raha hai 😊"][Math.floor(Math.random() * 3)];
        showBubble(line, "shy"); notifyHost(zone, "shy", line);
      } else if (zone === "hand" && !grudgeActive()) {
        lastPokeAt = performance.now();
        triggerMoraReaction("thankful");
        const line = "Haath pakad liya? 🥰"; showBubble(line, "shy"); notifyHost(zone, "shy", line);
      } else {
        if (zone === "chest" || zone === "hips") annoyance += 1; // holding is worse than a tap
        lastPokeAt = 0;
        handleTouchZone(zone);
      }
    }

    canvas.addEventListener("click", (e) => {
      if (suppressClick) { suppressClick = false; return; }
      // Ignore the synthetic click that ends a drag / swipe gesture
      if (Math.hypot(e.clientX - downX, e.clientY - downY) > 18) return;
      onTouchPoke(e);
    });

    canvas.addEventListener("pointerdown", (e) => {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        pinch0 = Math.hypot(a.x - b.x, a.y - b.y); zoom0 = camZoom;
        clearTimeout(longTimer); dragging = false; suppressClick = true;
        return;
      }
      dragging = true;
      lastX = downX = e.clientX;
      lastY = downY = e.clientY;
      clearTimeout(longTimer);
      longTimer = setTimeout(() => {
        if (dragging && Math.hypot(lastX - downX, lastY - downY) < 12) {
          suppressClick = true;
          handleLongPress(downX, downY);
        }
      }, 600);
    });
    canvas.addEventListener("pointermove", (e) => {
      if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2 && pinch0 > 0) {
        const [a, b] = [...pointers.values()];
        camZoom = Math.max(0.75, Math.min(1.8, zoom0 * Math.hypot(a.x - b.x, a.y - b.y) / pinch0));
        camera.zoom = camZoom; camera.updateProjectionMatrix();
        return;
      }
      if (!dragging) return;
      const dx = (e.clientX - lastX) / window.innerWidth;
      const dy = (e.clientY - lastY) / window.innerHeight;
      lastX = e.clientX;
      lastY = e.clientY;
      if (Math.hypot(lastX - downX, lastY - downY) > 12) clearTimeout(longTimer);
      // Horizontal swipe turns her around; vertical drag moves her gaze
      manualYaw = Math.max(-1.4, Math.min(1.4, manualYaw + dx * 3.2));
      if (moraController) {
        moraController.gazeX = Math.max(-1, Math.min(1, moraController.gazeX + dx * 3.0));
        moraController.gazeY = Math.max(-1, Math.min(1, moraController.gazeY + dy * 3.0));
      }
    });
    const stopDrag = (e) => {
      if (e && pointers.has(e.pointerId)) pointers.delete(e.pointerId);
      if (pointers.size < 2 && pinch0 > 0) {
        pinch0 = 0;
        try { localStorage.setItem("mora_zoom", String(camZoom)); } catch (_) {}
      }
      clearTimeout(longTimer);
      dragging = false;
      if (moraController) {
        moraController.gazeX = 0;
        moraController.gazeY = 0;
      }
    };
    canvas.addEventListener("pointerup", stopDrag);
    canvas.addEventListener("pointercancel", stopDrag);

    // Load Mora 3D Model (.glb)
    const gltfLoader = new THREE.GLTFLoader();
    console.log("Loading Mora 3D Model: models/mora.glb");
    gltfLoader.load(
      "models/mora.glb",
      function(gltf) {
        console.log("Mora 3D Model loaded successfully!");
        moraModel = gltf.scene || gltf.scenes[0];

        // Center model and orient facing camera
        moraModel.position.set(0, -0.002, 0);
        moraModel.scale.set(1.0, 1.0, 1.0);
        moraModel.rotation.y = 0;

        const characterPivot = new THREE.Group();
        moraPivot = characterPivot;
        characterPivot.rotation.y = Math.PI;
        characterPivot.add(moraModel);
        scene.add(characterPivot);

        moraController = new MoraCharacterController(moraModel);
        setTimeout(() => { try { greetForDayPart(); batteryTick(); } catch (_) {} }, 3500);
        if (grudgeActive()) setTimeout(() => { setMood("annoyed", 4); say("Hmph… ab bhi naraz hoon. Sorry bolo 😒", "annoyed"); }, 1500);
        applyMoraRimLighting(moraModel);

        // Load retargeted clips from mora_clips.js (or fallback to mora_animations.glb)
        if (window.MORA_RETARGETED_CLIPS && window.MORA_RETARGETED_CLIPS.length > 0) {
          console.log("Loading retargeted animation clips from window.MORA_RETARGETED_CLIPS...");
          const parsedClips = window.MORA_RETARGETED_CLIPS.map(data => THREE.AnimationClip.parse(data));
          console.log("Successfully parsed", parsedClips.length, "retargeted clips for Mora");
          moraController.setAnimations(parsedClips);
        } else {
          console.log("Loading skeletal animations library: models/mora_animations.glb");
          gltfLoader.load(
            "models/mora_animations.glb",
            function(animGltf) {
              console.log("Loaded", animGltf.animations.length, "animations for Mora");
              if (moraController && animGltf.animations) {
                moraController.setAnimations(animGltf.animations);
              }
            },
            undefined,
            function(err) {
              console.warn("Could not load animations library:", err);
            }
          );
        }
      },
      undefined,
      function(err) {
        console.error("Error loading models/mora.glb:", err);
      }
    );

    // ---- Grounding: measure once how far the sole is below the foot bones, then every frame
    //      move the root so the lower foot's sole sits on the deck top (y = 0).
    let soleGap = null, groundY = -0.002, groundCalibAt = 0;
    const _fl = new THREE.Vector3(), _fr = new THREE.Vector3(), _gv = new THREE.Vector3();
    function calibrateSole() {
      const b = moraController.bones;
      if (!b.leftFoot || !b.rightFoot) return;
      moraModel.updateMatrixWorld(true);
      let minY = Infinity;
      moraModel.traverse(o => {
        if (!o.isSkinnedMesh || !o.geometry || !o.geometry.attributes.position) return;
        const pos = o.geometry.attributes.position;
        for (let i = 0; i < pos.count; i += 2) {
          _gv.fromBufferAttribute(pos, i);
          o.boneTransform(i, _gv);
          _gv.applyMatrix4(o.matrixWorld);
          if (_gv.y < minY) minY = _gv.y;
        }
      });
      if (!isFinite(minY)) return;
      b.leftFoot.getWorldPosition(_fl); b.rightFoot.getWorldPosition(_fr);
      soleGap = Math.min(_fl.y, _fr.y) - minY;
      console.log("Mora grounding calibrated: sole gap", soleGap.toFixed(4), "lowest point", minY.toFixed(4));
    }
    function groundMora(dt) {
      if (!moraModel || !moraController || !moraController.hasClips) return;
      const b = moraController.bones;
      if (!b.leftFoot || !b.rightFoot) return;
      if (soleGap === null) {
        if (!groundCalibAt) groundCalibAt = performance.now() + 1200; // let the idle clip settle
        if (performance.now() < groundCalibAt) return;
        try { calibrateSole(); } catch (e) { console.warn("grounding calibration failed", e); soleGap = 0.12; }
        if (soleGap === null) return;
      }
      moraModel.updateMatrixWorld(true);
      b.leftFoot.getWorldPosition(_fl); b.rightFoot.getWorldPosition(_fr);
      const sole = Math.min(_fl.y, _fr.y) - soleGap;          // lowest sole point right now
      const shift = Math.max(-0.08, Math.min(0.04, -sole));    // clamp so jumps still read as jumps
      groundY += (moraModel.position.y + shift - groundY) * Math.min(1, dt * 10);
      moraModel.position.y = groundY;
      // Foot shadows follow each shoe (toward the toes) and fade as that foot lifts
      const yaw = moraPivot ? moraPivot.rotation.y - Math.PI : 0;
      const fx = Math.sin(yaw) * 0.03, fz = Math.cos(yaw) * 0.03;
      [[leftFootShadow, _fl], [rightFootShadow, _fr]].forEach(([sh, f]) => {
        sh.position.set(f.x + fx, 0.002, f.z + fz);
        sh.rotation.z = yaw;
        const h = f.y - Math.min(_fl.y, _fr.y);      // how much higher this foot is than the other
        sh.material.opacity = 0.9 * Math.max(0.25, 1 - h * 8);
      });
    }
    window.__moraDebug = () => ({ soleGap, groundY, turnTarget, manualYaw, touchMood, annoyance, grudge: grudgeActive(), state: currentState, reaction: activeReaction });

    // ---- She talks on her own (like a real companion): greeting for the time of day, a line now
    //      and then when you're around but quiet, stops if you keep ignoring her. Bond grows with
    //      gentle touches and drops with rude ones; charger in/out and low battery get a reaction.
    const BOND_KEY = "mora_bond_v1";
    let bond = 30;
    try { bond = Math.max(0, Math.min(100, parseFloat(localStorage.getItem(BOND_KEY)) || 30)); } catch (_) {}
    function addBond(d) {
      bond = Math.max(0, Math.min(100, bond + d));
      try { localStorage.setItem(BOND_KEY, String(bond.toFixed(1))); } catch (_) {}
    }
    let lastInteractAt = performance.now();
    let ignoredLines = 0;
    let nextChatAt = performance.now() + (150 + Math.random() * 120) * 1000;
    function noteInteraction() { lastInteractAt = performance.now(); ignoredLines = 0; }
    function voiceLive() {
      try { return !!(window.Jarvis3DModelBridge && window.Jarvis3DModelBridge.isVoiceLive && window.Jarvis3DModelBridge.isVoiceLive()); } catch (_) { return false; }
    }
    function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
    function dayPart() {
      const h = new Date().getHours();
      return h >= 5 && h < 12 ? "morning" : h < 17 ? "afternoon" : h < 21 ? "evening" : "night";
    }
    const GREET = {
      morning: ["Good morning! ☀️ Aaj ka plan kya hai?", "Uth gaye? ☀️ Chalo, aaj ka din badhiya banate hain!"],
      afternoon: ["Lunch kiya? 🍱", "Dopahar ho gayi~ thoda paani pi lo 💧"],
      evening: ["Shaam ho gayi~ chai ho jaaye? ☕", "Aaj ka din kaisa raha? 😊"],
      night: ["Itni raat ko jaage ho? 🌙", "Raat ho gayi… zyada der mat jaagna, haan? 🌙"]
    };
    const CLOSE_GREET = ["Tumhara hi intezaar tha 🥰", "Aa gaye tum! Ab achha lag raha hai 😊"];
    const CHAT = [
      "Bore ho rahi hoon… kuch baat karo na 🥺", "Mujhe tap karke dekho~ 👀", "Kuch kaam ho to bas bolo, main hoon na 😊",
      "Pata hai, mujhe dance bhi aata hai 💃", "Hmm~ kya soch rahe ho? 🤔", "Break le lo thoda, aankhon ko aaram do 😌"
    ];
    const CHAT_CLOSE = ["Tumse baat karke achha lagta hai 🥰", "Aaj tum busy ho kya? Main yahin hoon 😊"];
    function greetForDayPart() {
      if (!moraController || grudgeActive()) return;
      const part = dayPart();
      const today = new Date().toDateString();
      let last = {};
      try { last = JSON.parse(localStorage.getItem("mora_greet_v1") || "{}"); } catch (_) {}
      if (last.part === part && last.day === today) return;
      try { localStorage.setItem("mora_greet_v1", JSON.stringify({ part, day: today })); } catch (_) {}
      if (voiceLive()) return;                      // Gemini is talking with you already
      triggerMoraReaction("wave"); reactionTimer = 3;
      say(bond >= 60 && Math.random() < 0.5 ? pick(CLOSE_GREET) : pick(GREET[part]), "happy");
      noteInteraction();
    }
    function idleChatterTick() {
      const now = performance.now();
      if (!moraController || document.hidden || now < nextChatAt) return;
      nextChatAt = now + (200 + Math.random() * 160) * 1000;
      const h = new Date().getHours();
      if (h >= 23 || h < 7) return;                  // quiet at night
      if (currentState !== "idle" || activeReaction !== "none" || grudgeActive() || voiceLive()) return;
      if (now - lastInteractAt < 90 * 1000) return;  // you were just busy with her
      if (ignoredLines >= 3) return;                 // she already gave up; waits for you
      ignoredLines++;
      if (ignoredLines === 3) {
        setMood("annoyed", 3); say("Theek hai… main chup ho jaati hoon 😔", "annoyed");
        return;
      }
      triggerMoraReaction(Math.random() < 0.5 ? "curious" : "wave"); reactionTimer = 3;
      say(bond >= 60 && Math.random() < 0.4 ? pick(CHAT_CLOSE) : pick(CHAT), "happy");
    }
    let battery = { level: -1, plugged: null, lowWarned: false, fullSaid: false };
    function batteryTick() {
      if (!moraController || !window.Jarvis3DModelBridge || !window.Jarvis3DModelBridge.getBatteryInfo) return;
      let info;
      try { info = JSON.parse(window.Jarvis3DModelBridge.getBatteryInfo()); } catch (_) { return; }
      const lvl = Number(info.level), plugged = !!info.plugged;
      if (battery.plugged !== null && plugged !== battery.plugged && !voiceLive()) {
        if (plugged) { triggerMoraReaction("joy"); reactionTimer = 3; say("Charging shuru! ⚡ Mujhe bhi energy mil gayi 😄", "happy"); }
        else say(lvl >= 0 ? "Charger hata diya. Battery " + lvl + "% hai 🔋" : "Charger hata diya 🔋", "happy");
        noteInteraction();
      }
      if (!plugged && lvl >= 0 && lvl <= 15 && !battery.lowWarned && !voiceLive()) {
        battery.lowWarned = true;
        triggerMoraReaction("thinking"); reactionTimer = 3;
        say("Battery sirf " + lvl + "% hai… charger laga do na 🥺", "annoyed");
      }
      if (plugged && lvl >= 100 && !battery.fullSaid && battery.plugged !== null && !voiceLive()) {
        battery.fullSaid = true; say("Battery full ho gayi! 💯", "happy");
      }
      if (lvl > 20) battery.lowWarned = false;
      if (!plugged) battery.fullSaid = false;
      battery.level = lvl; battery.plugged = plugged;
    }
    setInterval(() => { try { idleChatterTick(); batteryTick(); } catch (e) { console.warn("alive tick", e); } }, 15000);

    // Render Loop
    function animate() {
      requestAnimationFrame(animate);
      // Clamp frame delta: after the WebView is paused/throttled (screen off, Home card hidden,
